<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pixelated-game</title>
<style>
html,body{margin:0;height:100%;background:#0b0a10;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,calc(100vh*25/14));height:auto;aspect-ratio:25/14;background:#000;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c" width="800" height="448"></canvas>
<script>
"use strict";
const cv=document.getElementById("c"),g=cv.getContext("2d");
const T=32,COLS=25,ROWS=14,W=800,H=448;
const CFG={speed:190,grav:1800,jump:600,coyote:.1,buf:.1,reach:3.6,pushT:.25,crateFall:.08,player:{w:22,h:44}};

const row=(...p)=>p.join("");
const BED="B".repeat(25);
const dots=n=>".".repeat(n);
const LV=[
{n:"First Shift",hint:"1/2/3 hotbar · Left-click mine/place/torch · Right-click place stone · Dig through.",time:0,map:[
 BED,
 ...Array(10).fill(row("B",dots(11),"#*#",dots(9),"B")),
 row("B.@.........","#*#","......E..","B"),
 BED,BED]},
{n:"Rusty Key",hint:"Watch out for Creepers & bats · Grab the key, unlock the door.",time:0,map:[
 BED,
 ...Array(6).fill(row("B",dots(17),"B",dots(5),"B")),
 row("B",dots(8),"k",dots(8),"B",dots(5),"B"),
 row("B",dots(7),"#*#",dots(7),"B",dots(5),"B"),
 row("B",dots(17),"B",dots(5),"B"),
 row("B",dots(3),"#*#",dots(11),"D",dots(5),"B"),
 row("B.@",dots(15),"D",dots(3),"E.B"),
 BED,BED]},
{n:"Dead Weight",hint:"Push the crate onto the plate to hold the gate open. 60 seconds.",time:60,map:[
 BED,
 ...Array(7).fill(row("B",dots(14),"B",dots(8),"B")),
 ...Array(3).fill(row("B",dots(14),"G",dots(8),"B")),
 row("B.@.C",dots(5),"P",dots(4),"G",dots(5),"E..B"),
 BED,BED]},
{n:"Build Your Way Out",hint:"Mine stone & ores, select slot 2 (or right-click) to place blocks and climb. 90s.",time:90,map:[
 BED,
 ...Array(3).fill(row("B",dots(23),"B")),
 row("B",dots(21),"E.B"),
 row("B",dots(18),"##*##","B"),
 ...Array(2).fill(row("B",dots(23),"B")),
 ...Array(3).fill(row("B",dots(5),"##*##",dots(13),"B")),
 row("B.@",dots(3),"##*##",dots(13),"B"),
 BED,BED]},
{n:"Daybreak",hint:"Place torches (slot 3) in the dark, flip the lever, and reach E. 80s.",time:80,map:[
 BED,
 ...Array(5).fill(row("B",dots(15),"B",dots(7),"B")),
 row("B",dots(5),"L",dots(9),"B",dots(7),"B"),
 row("B",dots(4),"##*#",dots(7),"G",dots(7),"B"),
 row("B",dots(15),"G",dots(7),"B"),
 ...Array(2).fill(row("B",dots(9),"#*#",dots(3),"G",dots(7),"B")),
 row("B.@",dots(7),"#*#",dots(3),"G",dots(4),"E..B"),
 BED,BED]}
];

let state="title",lvl=0,t=0,runT=0,shake=0,muted=false,mouse={x:0,y:0};
let grid,crates,keysT,plates,levers,P,exitT,inv,torchesCount,placedTorches,bats,creepers,hasKey,timeLeft,pushT=0,coy=0,buf=0,msg="",slot=0;
let levelTorches=[],swingT=0,crack={x:-1,y:-1,n:0},md=-1,mcd=0;
const K={l:0,r:0,u:0},SP=[];
for(let i=0;i<80;i++)SP.push({l:0,x:0,y:0,vx:0,vy:0,c:"#888"});
const hash=n=>Math.abs(Math.sin(n*127.1)*43758.5)%1;

const dk=document.createElement("canvas");dk.width=W;dk.height=H;const dx=dk.getContext("2d");
const lightSpr=document.createElement("canvas");lightSpr.width=lightSpr.height=256;
{const lx=lightSpr.getContext("2d"),lg=lx.createRadialGradient(128,128,8,128,128,128);
lg.addColorStop(0,"rgba(0,0,0,1)");lg.addColorStop(1,"rgba(0,0,0,0)");
lx.fillStyle=lg;lx.fillRect(0,0,256,256)}

let ac,nb;
function audio(){if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function tone(f,d,ty,v,sl,delay=0){
 if(!ac||muted)return;
 const o=ac.createOscillator(),n=ac.createGain(),a=ac.currentTime+delay;
 o.type=ty||"square";o.frequency.setValueAtTime(f,a);
 if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),a+d);
 n.gain.setValueAtTime(v||.07,a);n.gain.exponentialRampToValueAtTime(.0001,a+d);
 o.connect(n);n.connect(ac.destination);o.start(a);o.stop(a+d);
}
function dust(x,y,n,c,pw){
 for(let i=0,k=0;i<SP.length&&k<n;i++){const p=SP[i];
  if(p.l<=0){p.l=.4+Math.random()*.4;p.x=x;p.y=y;p.vx=(Math.random()-.5)*pw;p.vy=-Math.random()*pw*.7;p.c=c;k++}}
}
function noise(d,f,v,q){
 if(!ac||muted)return;
 if(!nb){nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),n=ac.createGain(),a0=ac.currentTime;
 s.buffer=nb;fl.type="bandpass";fl.frequency.value=f;fl.Q.value=q||1;
 n.gain.setValueAtTime(v,a0);n.gain.exponentialRampToValueAtTime(.0001,a0+d);
 s.connect(fl);fl.connect(n);n.connect(ac.destination);s.start(a0,Math.random()*.5);s.stop(a0+d);
}
const SFX={
 mine(){noise(.09,900,.3,2);tone(190,.08,"square",.05,.5)},
 brk(){noise(.28,450,.4,1);tone(110,.2,"sawtooth",.06,.4)},
 place(){noise(.06,300,.25,1);tone(160,.07,"square",.06,.7)},
 step(grass){noise(.045,grass?1500:650,.07,1.5)},
 land(){noise(.12,240,.18,1)},
 drip(){tone(1300+Math.random()*500,.14,"sine",.035,.4)},
 baa(){tone(330,.45,"sawtooth",.045,.62);tone(342,.45,"sawtooth",.03,.6)},
 chirp(){tone(2400,.05,"sine",.04,1.3);tone(2900,.06,"sine",.04,1.2,.08)},
 hiss(){noise(.22,2200,.18,3)},
 boom(){noise(.45,180,.55,.7);tone(75,.35,"sawtooth",.12,.3)}
};
let stepT=0,dripT=2,prevG=true,fallV=0;
function extras(dt){
 mcd-=dt;if(md===0&&mcd<=0&&state==="play"){act(0);mcd=.24}
 if(swingT>0)swingT-=dt;
 stepT-=dt;if(P.onG&&Math.abs(P.vx)>1&&stepT<=0){SFX.step(state==="out");stepT=.27}
 if(!P.onG)fallV=Math.max(fallV,P.vy);else{if(!prevG&&fallV>320)SFX.land();fallV=0}
 prevG=P.onG;
 if(state==="play"){dripT-=dt;if(dripT<=0){SFX.drip();dripT=2+Math.random()*4}}
}

function cacheTorches(){
 levelTorches=[];
 for(let x=3;x<COLS-2;x+=6){
  const y=3+((hash(x*3.3+lvl*7)*4)|0);
  if(grid[y][x]==="."&&!(exitT&&x===exitT.x&&y===exitT.y))levelTorches.push({x,y});
 }
}
function load(i){
 crack.n=0;
 const L=LV[i];grid=L.map.map(r=>r.split(""));
 crates=[];keysT=[];plates=[];levers=[];placedTorches=[];bats=[];creepers=[];exitT=null;
 inv=0;torchesCount=2;hasKey=false;timeLeft=L.time;pushT=0;
 const openSpots=[];
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  const c=grid[y][x];
  if(c==="@"){P={x:x*T+5,y:(y+1)*T-CFG.player.h,w:CFG.player.w,h:CFG.player.h,vx:0,vy:0,onG:false,face:1};grid[y][x]="."}
  else if(c==="E"){exitT={x,y};grid[y][x]="."}
  else if(c==="k"){keysT.push({x,y});grid[y][x]="."}
  else if(c==="P"){plates.push({x,y});grid[y][x]="."}
  else if(c==="L"){levers.push({x,y,on:false});grid[y][x]="."}
  else if(c==="C"){crates.push({x,y,fall:0});grid[y][x]="."}
  else if(c==="."&&y>=2&&y<=ROWS-3&&x>=6&&x<=COLS-4)openSpots.push({x,y});
 }
 cacheTorches();
 for(let b=0;b<2+i;b++){
  const sp=openSpots[(b*7+i*3)%Math.max(1,openSpots.length)];
  if(sp)bats.push({x:sp.x*T+16,y:sp.y*T+12,baseY:sp.y*T+12,ph:b*1.7,dir:b%2?1:-1});
 }
 if(i>=1){
  for(let cr=0;cr<Math.min(2,i);cr++){
   const sp=openSpots[(cr*11+i*5+2)%Math.max(1,openSpots.length)];
   if(sp&&grid[sp.y+1]&&grid[sp.y+1][sp.x]!=="."){
    creepers.push({x:sp.x*T+6,y:(sp.y+1)*T-28,w:18,h:28,vx:0,vy:0,dir:cr%2?1:-1,fuse:0,alive:true});
   }
  }
 }
}
const crateAt=(x,y)=>crates.find(c=>c.x===x&&c.y===y);
const plateDown=p=>!!crateAt(p.x,p.y)||(P.x<(p.x+1)*T&&P.x+P.w>p.x*T&&P.y<(p.y+1)*T&&P.y+P.h>p.y*T);
const powered=()=>levers.some(l=>l.on)||plates.some(plateDown);
function solidMine(x,y){
 if(x<0||y<0||x>=COLS||y>=ROWS)return true;
 const c=grid[y][x];
 if(c==="#"||c==="*"||c==="B"||c==="D")return true;
 if(c==="G"&&!powered())return true;
 return !!crateAt(x,y);
}
function solid(x,y){return state==="out"?y>=sh(x):solidMine(x,y)}
const occupied=(x,y)=>keysT.some(k=>k.x===x&&k.y===y)||plates.some(p=>p.x===x&&p.y===y)||levers.some(l=>l.x===x&&l.y===y)||placedTorches.some(tr=>tr.x===x&&tr.y===y)||(exitT&&exitT.x===x&&exitT.y===y);
const bnd=()=>[Math.floor(P.x/T),Math.floor((P.x+P.w-.01)/T),Math.floor(P.y/T),Math.floor((P.y+P.h-.01)/T)];

function moveX(dt){
 P.x+=P.vx*dt;
 const[x0,x1,y0,y1]=bnd();let hitCrate=false;
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)){
  if(P.vx>0)P.x=tx*T-P.w;else if(P.vx<0)P.x=(tx+1)*T;
  const c=state==="play"?crateAt(tx,ty):null;
  if(c&&P.vx!==0){
   hitCrate=true;pushT+=dt;
   if(pushT>CFG.pushT){const nx=c.x+Math.sign(P.vx);if(!solid(nx,c.y)){c.x=nx;tone(110,.08,"square",.05)}pushT=0}
  }
  if(!hitCrate)pushT=0;
  return;
 }
 pushT=0;
}
function moveY(dt){
 P.y+=P.vy*dt;P.onG=false;
 const[x0,x1,y0,y1]=bnd();
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)){
  if(P.vy>0){P.y=ty*T-P.h;P.onG=true}else if(P.vy<0)P.y=(ty+1)*T;
  P.vy=0;return;
 }
}
function crackDraw(){
 if(crack.n>0){const X=crack.x*T,Y=crack.y*T;g.strokeStyle="rgba(0,0,0,.65)";g.lineWidth=2;g.beginPath();g.moveTo(X+6,Y+4);g.lineTo(X+16,Y+16);g.lineTo(X+10,Y+28);g.moveTo(X+16,Y+16);g.lineTo(X+27,Y+22);g.stroke()}
}
function placeStone(tx,ty){
 if(grid[ty][tx]==="."&&inv>0&&!crateAt(tx,ty)&&!occupied(tx,ty)){
  const ov=P.x<(tx+1)*T&&P.x+P.w>tx*T&&P.y<(ty+1)*T&&P.y+P.h>ty*T;
  if!ov[tx]="#";inv--;SFX.place()}
 }
 if(btn===2){placeStone(tx,ty);return}
 if(btn===0){
  if(slot===1){placeStone(tx,ty);return}
  if(slot===2){
   if(grid[ty][tx]==="."&&torchesCount>0&&!crateAt(tx,ty)&&!occupied(tx,ty)){
    placedTorches.push({x:tx,y:ty});torchesCount--;SFX.place();
   }
   return;
  }
  const tile=grid[ty][tx];
  if(tile==="#"||tile==="*"){
   swingT=.2;
   const req=tile==="*"?1:2;
   if(crack.x===tx&&crack.y===ty)crack.n++;else crack={x:tx,y:ty,n:1};
   if(crack.n>=req){
    grid[ty][tx]=".";inv+=tile==="*"?2:1;
    if(tile==="*")torchesCount++;
    crack={x:-1,y:-1,n:0};
    dust(tx*T+16,ty*T+16,11,tile==="*"?"#ffd166":"#8d8696",220);SFX.brk();
   }else{SFX.mine();dust(tx*T+16,ty*T+16,3,"#8d8696",120)}
  }
 }
}
function interact(){
 for(const l of levers)if(Math.hypot(l.x*T+16-(P.x+11),l.y*T+16-(P.y+22))<T*1.6){l.on=!l.on;tone(260,.1,"square",.07,l.on?1.6:.6)}
}
function detonateCreeper(cr){
 cr.alive=false;shake=12;SFX.boom();
 const cx=Math.floor((cr.x+cr.w/2)/T),cy=Math.floor((cr.y+cr.h/2)/T);
 dust(cx*T+16,cy*T+16,24,"#78c850",280);
 for(let dy=-1;dy<=1;dy++)for(let dx2=-1;dx2<=1;dx2++){
  const nx=cx+dx2,ny=cy+dy;
  if(ny>0&&ny<ROWS-1&&nx>0&&nx<COLS-1&&(grid[ny][nx]==="#"||grid[ny][nx]==="*")){
   grid[ny][nx]=".";inv++;
  }
 }
 if(Math.hypot(P.x+P.w/2-(cx*T+16),P.y+P.h/2-(cy*T+16))<T*2.2){
  state="over";msg="Blasted by a Creeper.";
 }
}
function update(dt){
 runT+=dt;extras(dt);
 if(timeLeft>0||LV[lvl].time){
  timeLeft-=dt;
  if(timeLeft<=10&&timeLeft>0){shake=Math.max(shake,2.5);if(Math.random()<dt*14)dust(Math.random()*W,0,2,"#6b6470",60)}
  if(timeLeft<=0){state="over";msg="The ceiling came down.";tone(70,.8,"sawtooth",.12,.4);shake=14;return}
 }
 const dir=K.r-K.l;P.vx=dir*CFG.speed;if(dir)P.face=dir;
 P.vy=Math.min(900,P.vy+CFG.grav*dt);
 coy=P.onG?CFG.coyote:coy-dt;buf-=dt;
 if(buf>0&&coy>0){P.vy=-CFG.jump;coy=0;buf=0;P.onG=false;tone(330,.12,"square",.05,1.8)}
 moveX(dt);moveY(dt);

 for(const b of bats){
  b.x+=b.dir*44*dt;
  b.y=b.baseY+Math.sin(t*7+b.ph)*8;
  const gx=Math.floor(b.x/T);
  if(gx<=1||gx>=COLS-2||solidMine(gx,Math.floor(b.y/T)))b.dir*=-1;
 }
 for(const cr of creepers){
  if(!cr.alive)continue;
  const dist=Math.hypot(P.x+P.w/2-(cr.x+cr.w/2),P.y+P.h/2-(cr.y+cr.h/2));
  if(dist<T*4.5){
   cr.dir=P.x+P.w/2>cr.x+cr.w/2?1:-1;
   cr.vx=cr.dir*95;
   if(dist<T*1.4){if(cr.fuse===0)SFX.hiss();cr.fuse+=dt;if(cr.fuse>=.85){detonateCreeper(cr);if(state==="over")return}}
   else cr.fuse=Math.max(0,cr.fuse-dt*1.5);
  }else{cr.vx=cr.dir*42;cr.fuse=0}
  cr.vy=Math.min(900,cr.vy+CFG.grav*dt);
  cr.x+=cr.vx*dt;
  let cx0=Math.floor(cr.x/T),cx1=Math.floor((cr.x+cr.w-.01)/T),cy0=Math.floor(cr.y/T),cy1=Math.floor((cr.y+cr.h-.01)/T);
  for(let ty=cy0;ty<=cy1;ty++)for(let tx=cx0;tx<=cx1;tx++)if(solidMine(tx,ty)){
   if(cr.vx>0)cr.x=tx*T-cr.w;else if(cr.vx<0)cr.x=(tx+1)*T;
   cr.dir*=-1;
  }
  cr.y+=cr.vy*dt;
  cx0=Math.floor(cr.x/T);cx1=Math.floor((cr.x+cr.w-.01)/T);cy0=Math.floor(cr.y/T);cy1=Math.floor((cr.y+cr.h-.01)/T);
  for(let ty=cy0;ty<=cy1;ty++)for(let tx=cx0;tx<=cx1;tx++)if(solidMine(tx,ty)){
   if(cr.vy>0)cr.y=ty*T-cr.h;else if(cr.vy<0)cr.y=(ty+1)*T;
   cr.vy=0;
  }
 }

 for(const c of crates){
  const below=solidMine(c.x,c.y+1),inP=P.x<(c.x+1)*T&&P.x+P.w>c.x*T&&P.y<(c.y+2)*T&&P.y+P.h>(c.y+1)*T;
  if(!below&&!inP){c.fall+=dt;if(c.fall>CFG.crateFall){c.y++;c.fall=0}}else c.fall=0;
 }
 for(let i=keysT.length-1;i>=0;i--){const k=keysT[i];
  if(P.x<(k.x+1)*T&&P.x+P.w>k.x*T&&P.y<(k.y+1)*T&&P.y+P.h>k.y*T){keysT.splice(i,1);hasKey=true;tone(700,.2,"triangle",.08,1.6)}}
 if(hasKey){
  const[x0,x1,y0,y1]=bnd();
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0-1;tx<=x1+1;tx++)if(grid[ty]&&grid[ty][tx]==="D"){
   for(let y=0;y<ROWS;y++)if(grid[y][tx]==="D")grid[y][tx]=".";
   hasKey=false;dust(tx*T+16,ty*T,14,"#a8743a",260);tone(180,.3,"sawtooth",.08,.5);
  }
 }
 if(exitT&&Math.floor((P.x+P.w/2)/T)===exitT.x&&Math.floor((P.y+P.h/2)/T)===exitT.y){
  state=lvl===LV.length-1?"end":"clear";tone(520,.25,"triangle",.09);tone(660,.3,"triangle",.09,.15);
 }
}

const SURF={lim:150,home:3};
const sh=x=>Math.abs(x-SURF.home)<6?9:9+Math.round(Math.sin(x*.11)*1.6+Math.sin(x*.047+2)*2.2);
let mobs=[],camX=0,outT=0,birdT=3;
function enterOut(){
 state="out";outT=0;P.x=SURF.home*T+6;P.y=sh(SURF.home)*T-P.h-2;P.vx=P.vy=0;P.onG=false;
 mobs=[];
 for(let i=0;i<14;i++)mobs.push({kind:"sheep",x:(-140+i*21+hash(i*3.1)*12)*T,d:0,t:hash(i)*3,hh:0,hv:0});
 for(let i=0;i<6;i++)mobs.push({kind:"pig",x:(-90+i*34+hash(i*5.2)*10)*T,d:1,t:hash(i+4)*3,hh:0,hv:0});
 for(let i=0;i<5;i++)mobs.push({kind:"cow",x:(-70+i*42+hash(i*8.1)*10)*T,d:-1,t:hash(i+9)*3,hh:0,hv:0});
 mobs.push({kind:"sheep",x:14*T,d:0,t:1,hh:0,hv:0},{kind:"pig",x:19*T,d:-1,t:2,hh:0,hv:0},{kind:"cow",x:26*T,d:1,t:1.5,hh:0,hv:0});
 mobs.push({kind:"villager",x:8*T,d:-1,t:99,hh:0,hv:0});
 tone(520,.2,"triangle",.07);
}
function updateOut(dt){
 outT+=dt;extras(dt);
 const dir=K.r-K.l;P.vx=dir*CFG.speed*1.1;if(dir)P.face=dir;
 P.vy=Math.min(900,P.vy+CFG.grav*dt);coy=P.onG?CFG.coyote:coy-dt;buf-=dt;
 if(buf>0&&coy>0){P.vy=-CFG.jump;coy=0;buf=0;tone(330,.12,"square",.05,1.8)}
 const ox=P.x;moveX(dt);
 if(dir&&P.onG&&Math.abs(P.x-(ox+P.vx*dt))>.01)P.vy=-360;
 moveY(dt);camX=P.x-W/2+11;
 for(const m of mobs){
  if(m.kind==="villager"){m.d=P.x<m.x?-1:1;continue}
  m.t-=dt;if(m.t<=0){m.d=[-1,0,1][(Math.random()*3)|0];m.t=2+Math.random()*4}
  m.x+=m.d*(m.kind==="pig"?34:24)*dt;
  if(m.hv||m.hh){m.hh-=m.hv*dt;m.hv+=900*dt;if(m.hh<=0){m.hh=0;m.hv=0}}
  if(Math.abs(m.x-P.x)<90&&Math.random()<dt*.12)SFX.baa();
 }
 birdT-=dt;if(birdT<=0){SFX.chirp();birdT=3+Math.random()*5}
 if(Math.abs(P.x/T-SURF.home)>SURF.lim){state="far";tone(300,.5,"sawtooth",.07,.4)}
}
function clickOut(){
 const wx=mouse.x+camX;
 for(const m of mobs){
  if(m.kind==="villager"&&Math.abs(wx-m.x)<28&&Math.abs(mouse.y-(sh(Math.floor(m.x/T))*T-24))<30){tone(580,.12,"triangle",.06,1.2);return}
  if(Math.abs(wx-m.x)<26&&Math.abs(mouse.y-(sh(Math.floor(m.x/T))*T-m.hh-12))<26){m.hv=-320;SFX.baa();return}
 }
}
function drawMob(m){
 const x=m.x,gy=sh(Math.floor(x/T))*T-m.hh,f=m.d||1;
 if(m.kind==="sheep"){

function drawOut(){
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,"#6ec1e4");gr.addColorStop(1,"#ffe0a8");g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle="rgba(255,240,160,.25)";g.fillRect(606,36,72,72);g.fillStyle="#fff3b0";g.fillRect(620,50,44,44);
 g.fillStyle="rgba(255,255,255,.85)";
 for(let i=0;i<7;i++){const cx=(((i*230-camX*.2)%1600)+1600)%1600-200,cy=36+(i%3)*32;g.fillRect(cx,cy,90,18);g.fillRect(cx+20,cy-12,50,14)}
 g.fillStyle="#86c29a";g.beginPath();g.moveTo(0,H);
 for(let x=0;x<=W;x+=16)g.lineTo(x,250-Math.sin((x+camX*.4)*.012)*28-Math.sin((x+camX*.4)*.03)*10);
 g.lineTo(W,H);g.fill();

 const c0=Math.floor(camX/T)-1,gy0=sh(SURF.home)*T;
 g.fillStyle="#6b6470";g.fillRect(-5*T,gy0-5*T,7*T,H);g.fillStyle="#7d7682";g.fillRect(-5*T,gy0-5*T,7*T,8);
 g.fillStyle="#0c0a10";g.fillRect(-3*T,gy0-3*T,3*T,3*T);g.fillStyle="#5d4129";g.fillRect(-3*T-6,gy0-3*T-6,3*T+12,8);g.fillRect(-3*T-6,gy0-3*T,8,3*T);g.fillRect(-6,gy0-3*T,8,3*T);
 for(let x=c0;x<c0+28;x++){
  const gy=sh(x)*T,X=x*T;
  if(hash(x*3.7+1)>.85&&hash((x-1)*3.7+1)<=.85&&hash((x-2)*3.7+1)<=.85&&Math.abs(x-SURF.home)>6){
   const th=2+((hash(x*1.3)*2)|0);
   g.fillStyle="#6b4423";g.fillRect(X+10,gy-th*T,12,th*T);
   g.fillStyle="#2f8f2f";g.fillRect(X-T,gy-(th+1)*T,3*T,T);g.fillRect(X,gy-(th+2)*T,T,T);

  }

 }

function drawTile(c,x,y){
 const X=x*T,Y=y*T,h=hash(x*13+y*7);
 if(c==="#"||c==="*"){
  g.fillStyle=["#6b6470","#625b68","#756d7a"][(h*3)|0];g.fillRect(X,Y,T,T);
  g.fillStyle="rgba(255,255,255,.13)";g.fillRect(X,Y,T,3);
  g.fillStyle="rgba(0,0,0,.25)";g.fillRect(X,Y+T-3,T,3);g.fillRect(X+8+h*10,Y+10,5,4);g.fillRect(X+4,Y+20,4,3);
  if(c==="*"){g.fillStyle="#ffd166";g.fillRect(X+6,Y+7,5,5);g.fillRect(X+19,Y+15,6,5);g.fillRect(X+11,Y+22,4,4)}
  else if(h>.88){g.fillStyle="#e6c34a";g.fillRect(X+6,Y+8,4,4);g.fillRect(X+18,Y+18,5,4)}
  else if(h<.1){g.fillStyle="#1b1b1f";g.fillRect(X+8,Y+10,6,5);g.fillRect(X+19,Y+6,4,4)}
 }else if(c==="B"){
  g.fillStyle="#2b2833";g.fillRect(X,Y,T,T);
  g.strokeStyle="#1e1c25";g.lineWidth=2;g.strokeRect(X+1,Y+1,T-2,T-2);
 }else if(c==="D"){
  g.fillStyle="#7a4b25";g.fillRect(X,Y,T,T);
  g.fillStyle="#5a3418";for(let i=0;i<4;i++)g.fillRect(X+i*8,Y,2,T);
  g.fillStyle="#f2c200";g.beginPath();g.arc(X+T/2,Y+T/2,5,0,7);g.fill();
 }else if(c==="G"){
  const on=powered();
  g.fillStyle=on?"rgba(150,160,175,.25)":"#8a8f99";
  for(let i=0;i<4;i++)g.fillRect(X+3+i*8,Y,4,T);
  g.fillRect(X,Y,T,4);g.fillRect(X,Y+T-4,T,4);
 }
}
function drawBack(){
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,"#171321");gr.addColorStop(1,"#261f31");g.fillStyle=gr;g.fillRect(0,0,W,H);

 for(let x=1;x<COLS-1;x++){const L=hash(x*1.9+lvl)*44;if(L>14&&grid[1][x]==="."){g.beginPath();g.moveTo(x*T+6,T);g.lineTo(x*T+26,T);g.lineTo(x*T+16,T+L);g.fill()}}
 if(lvl>=3){g.fillStyle="rgba(255,214,140,.08)";for(let i=0;i<6;i++){const x=40+i*140+Math.sin(t*.4+i)*10;g.beginPath();g.moveTo(x,0);g.lineTo(x+60,0);g.lineTo(x+200,H);g.lineTo(x+130,H);g.fill()}}
 for(let x=3;x<COLS-2;x+=6){

 }
}
function drawWorld(){
 drawBack();
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(grid[y][x]!==".")drawTile(grid[y][x],x,y);
 crackDraw();
 for(const tr of placedTorches){
  const X=tr.x*T,Y=tr.y*T,fl=Math.sin(t*16+tr.x)*1.5;

 for(const c of crates){const X=c.x*T,Y=c.y*T;g.fillStyle="#a9743c";g.fillRect(X+1,Y+1,T-2,T-2);g.strokeStyle="#6b4520";g.lineWidth=3;g.strokeRect(X+3,Y+3,T-6,T-6);g.beginPath();g.moveTo(X+3,Y+3);g.lineTo(X+T-3,Y+T-3);g.moveTo(X+T-3,Y+3);g.lineTo(X+3,Y+T-3);g.stroke()}

const DARK=[.9,.88,.86,.62,.42];
function drawDark(){
 dx.globalCompositeOperation="source-over";dx.globalAlpha=1;
 dx.fillStyle="rgba(4,3,8,"+DARK[Math.min(lvl,4)]+")";dx.fillRect(0,0,W,H);
 dx.globalCompositeOperation="destination-out";
 const lit=(x,y,r,a)=>{dx.globalAlpha=a;dx.drawImage(lightSpr,x-r,y-r,r*2,r*2)};
 lit(P.x+P.w/2,P.y+14,195,1);
 if(exitT)lit(exitT.x*T+16,exitT.y*T+16,100,.8);
 for(const l of levers)lit(l.x*T+16,l.y*T+16,50,.5);
 for(const q of levelTorches)lit(q.x*T+16,q.y*T+14,95+Math.sin(t*9+q.x)*8,.85);
 for(const tr of placedTorches)lit(tr.x*T+16,tr.y*T+14,115+Math.sin(t*11+tr.x)*6,.92);
 dx.globalAlpha=1;
 g.drawImage(dk,0,0);
}
function drawCursor(){
 const tx=Math.floor(mouse.x/T),ty=Math.floor(mouse.y/T);
 if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return;
 const ok=Math.hypot(tx*T+16-(P.x+P.w/2),ty*T+16-(P.y+22))<=CFG.reach*T;
 g.strokeStyle=ok?"rgba(255,255,255,.8)":"rgba(255,80,80,.4)";g.lineWidth=2;g.strokeRect(tx*T+1,ty*T+1,T-2,T-2);
}
function hud(){
 g.font="700 16px system-ui,sans-serif";g.textAlign="left";g.fillStyle="#fff";
 g.fillText("Room "+(lvl+1)+": "+LV[lvl].n,12,24);
 g.fillStyle="#cfd8e3";g.fillText("Stone ×"+inv+"   Torches ×"+torchesCount+(hasKey?"   Key ✓":""),12,44);
 const names=["[1] Pick","[2] Stone","[3] Torch"];
 for(let i=0;i<3;i++){
  const bx=12+i*84,by=54;
  g.fillStyle=slot===i?"rgba(255,209,102,.28)":"rgba(15,14,22,.65)";g.fillRect(bx,by,78,24);
  g.strokeStyle=slot===i?"#ffd166":"rgba(255,255,255,.25)";g.lineWidth=1.5;g.strokeRect(bx,by,78,24);
  g.fillStyle="#fff";g.font="600 12px system-ui,sans-serif";g.textAlign="center";g.fillText(names[i],bx+39,by+16);

 if(LV[lvl].time){g.textAlign="right";g.fillStyle=timeLeft<10?"#ff6b6b":"#fff";g.font="800 22px system-ui,sans-serif";g.fillText(Math.max(0,timeLeft).toFixed(0)+"s",W-14,28)}
 g.textAlign="center";g.font="500 14px system-ui,sans-serif";g.fillStyle="rgba(255,255,255,.75)";g.fillText(LV[lvl].hint,W/2,H-12);
}
function card(title,lines,sub){
 g.fillStyle="rgba(6,5,10,.78)";g.fillRect(0,0,W,H);g.textAlign="center";
 g.fillStyle="#ffd166";g.font="800 44px system-ui,sans-serif";g.fillText(title,W/2,140);
 g.fillStyle="#fff";g.font="500 19px system-ui,sans-serif";lines.forEach((l,i)=>g.fillText(l,W/2,190+i*28));
 g.fillStyle="#cfd8e3";g.font="600 15px system-ui,sans-serif";g.fillText(sub,W/2,190+lines.length*28+30);
}
function draw(){
 if(state==="out"||state==="far"){drawOutAll();return}
 g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 drawWorld();drawPlayer();
 SP.forEach(p=>{if(p.l>0){g.fillStyle=p.c;g.fillRect(p.x,p.y,3,3)}});
 drawDark();g.restore();
 if(state==="play"){drawCursor();hud()}
 else if(state==="title")card("pixelated-game",["Mine ores & stone, place blocks & torches, dodge Creepers.","A/D move · W/Space jump · E lever · 1/2/3 hotbar · R reset"],"Press SPACE to start   ·   M mute");
 else if(state==="clear")card("Room cleared!",["Next: "+LV[lvl+1].n].concat(lvl===2?["A little light is seeping down from above…"]:[]),"Press SPACE to continue");
 else if(state==="over")card(msg,["Every second counts down here."],"Press SPACE or R to try the room again");
 else if(state==="end")card("You escaped!",["Total time: "+runT.toFixed(1)+"s","Morning. The cave mouth opens onto green hills."],"SPACE: step outside   ·   R: play again from room 1");
}

let last=0;
function frame(ts){
 const dt=Math.min(.033,(ts-last)/1000||0);last=ts;t+=dt;
 if(state==="play")update(dt);else if(state==="out")updateOut(dt);
 if(shake>0)shake=Math.max(0,shake-dt*30);
 for(const p of SP)if(p.l>0){p.l-=dt;p.vy+=800*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
 draw();requestAnimationFrame(frame);
}
function start(i){lvl=i;load(i);state="play"}
function confirm(){
 audio();
 if(state==="title"){runT=0;start(0)}
 else if(state==="clear")start(lvl+1);
 else if(state==="over")start(lvl);
 else if(state==="end")enterOut();else if(state==="far"){runT=0;start(0)}
 else if(state==="play"||state==="out")buf=CFG.buf;
}
addEventListener("keydown",e=>{
 if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();
 if(e.code==="KeyM"){muted=!muted;return}
 if(e.code==="Digit1")slot=0;
 if(e.code==="Digit2")slot=1;
 if(e.code==="Digit3")slot=2;
 if(e.repeat)return;
 if(e.code==="ArrowLeft"||e.code==="KeyA")K.l=1;
 if(e.code==="ArrowRight"||e.code==="KeyD")K.r=1;
 if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){K.u=1;confirm()}
 if(e.code==="KeyE"&&state==="play")interact();
 if(e.code==="KeyR"){if(state==="play"||state==="over")start(lvl);else if(state==="end"||state==="out"||state==="far"){runT=0;start(0)}}
});
addEventListener("keyup",e=>{
 if(e.code==="ArrowLeft"||e.code==="KeyA")K.l=0;
 if(e.code==="ArrowRight"||e.code==="KeyD")K.r=0;
 if((e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")&&(state==="play"||state==="out")&&P.vy<0)P.vy*=.45;
});
function setMouse(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height}
cv.addEventListener("mousemove",setMouse);
cv.addEventListener("mousedown",e=>{audio();setMouse(e);if(state==="play"){md=e.button;mcd=.24;act(e.button)}else if(state==="out")clickOut();else confirm()});
cv.addEventListener("wheel",e=>{slot=(slot+(e.deltaY>0?1:2))%3},{passive:true});
addEventListener("mouseup",()=>{md=-1});
cv.addEventListener("contextmenu",e=>e.preventDefault());
load(0);state="title";
requestAnimationFrame(frame);
</script>
