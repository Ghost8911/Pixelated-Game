<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zephrys</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #191a2e; font-family: monospace; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let viewW = 800;
let viewH = 450;
const groundY = 360;
const gravity = 1750;
let coyote = 0;
let jumpBuf = 0;
let dashTimer = 0;
let dashCD = 0;
let muted = false;
let audioCtx = null;
const player = { x: 80, y: groundY - 28, w: 22, h: 28, vx: 0, vy: 0, grounded: true, dir: 1 };
const keys = { left: false, right: false };

function sfx(freq, dur, type = "square", vol = 0.05) {
  if (muted) return;
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  viewH = 450;
  viewW = Math.max(360, Math.round(viewH * (window.innerWidth / Math.max(1, window.innerHeight))));
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
addEventListener("resize", resize);
resize();

addEventListener("keydown", e => {
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") jumpBuf = 0.12;
  if ((e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyK") && dashCD <= 0 && dashTimer <= 0) {
    dashTimer = 0.14; dashCD = 0.62; player.vy = 0; sfx(480, 0.08, "triangle", 0.05);
  }
  if (e.code === "KeyM") muted = !muted;
});
addEventListener("keyup", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
});

function update(dt) {
  const move = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (move && dashTimer <= 0) player.dir = move;

  coyote = player.grounded ? 0.11 : Math.max(0, coyote - dt);
  jumpBuf = Math.max(0, jumpBuf - dt);
  dashCD = Math.max(0, dashCD - dt);

  if (jumpBuf > 0 && coyote > 0 && dashTimer <= 0) {
    player.vy = -680; player.grounded = false; coyote = 0; jumpBuf = 0;
    sfx(350, 0.1, "square", 0.05);
  }
  if (dashTimer > 0) {
    dashTimer -= dt; player.vx = player.dir * 510; player.vy = 0;
  } else {
    player.vx = move * 225;
    player.vy = Math.min(920, player.vy + gravity * dt);
  }

  player.x = Math.max(0, Math.min(viewW - player.w, player.x + player.vx * dt));
  player.y += player.vy * dt;

  if (player.y >= groundY - player.h) {
    player.y = groundY - player.h;
    player.vy = 0;
    player.grounded = true;
  }
}

function render() {
  ctx.fillStyle = "#191a2e";
  ctx.fillRect(0, 0, viewW, viewH);
  ctx.fillStyle = "#38b000";
  ctx.fillRect(0, groundY, viewW, viewH - groundY);
  ctx.fillStyle = dashTimer > 0 ? "#ffd166" : "#e03131";
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 13px monospace";
  ctx.fillText(`[M] SFX:${muted ? "OFF" : "ON"}`, 14, 24);
}

let last = 0;
function loop(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
