<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Zephrs Game</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;padding:0;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:#191a2e;overflow:hidden;touch-action:none;font-family:"Courier New",monospace}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;image-rendering:pixelated}
#touchUI{position:fixed;inset:0;pointer-events:none;display:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#touchUI.on{display:block}
.pad{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:auto}
.pad.left{left:max(16px,env(safe-area-inset-left))}
.pad.right{right:max(16px,env(safe-area-inset-right))}
.tbtn{width:64px;height:64px;border-radius:16px;background:rgba(24,26,44,.72);border:2px solid rgba(255,255,255,.32);color:#fff;font:800 20px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,.4);transition:transform .08s cubic-bezier(.2,.9,.3,1.4),background .08s,border-color .08s}
.tbtn.act,.tbtn:active{transform:scale(.9);background:rgba(92,164,255,.5);border-color:#ffd166}
.tbtn.wide{width:78px;font-size:14px;letter-spacing:.6px}
#topBar{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:12;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.miniBtn{background:rgba(22,24,40,.78);border:1.5px solid rgba(255,255,255,.28);color:#eef2ff;padding:6px 9px;border-radius:9px;font:700 11px system-ui,sans-serif;cursor:pointer;transition:transform .08s,border-color .15s,background .15s}
.miniBtn:hover{border-color:#ffd166}
.miniBtn:active{transform:scale(.92)}
.miniBtn.hero{border-color:rgba(255,209,102,.65);color:#ffd166}
.miniBtn.quit{border-color:rgba(255,107,107,.55);color:#ffb3b3}
.miniBtn.quit:hover{background:rgba(220,38,38,.35);border-color:#ff6b6b;color:#fff}
</style>
</head>

<canvas id="c"></canvas>
<div id="topBar">
  <button class="miniBtn hero" id="btnChar">HERO</button>
  <button class="miniBtn" id="btnTouch">PAD</button>
  <button class="miniBtn" id="btnMute">SFX: ON</button>
  <button class="miniBtn" id="btnFull">FULL</button>
  <button class="miniBtn quit" id="btnQuit">QUIT</button>
</div>
<div id="touchUI">
  <div class="pad left">
    <div class="tbtn" id="bLeft">◀</div>
    <div class="tbtn" id="bRight">▶</div>
  </div>
  <div class="pad right">

</div>

function resize(){
 DPR=Math.min(2,window.devicePixelRatio||1);
 const vw=Math.max(1,window.innerWidth),vh=Math.max(1,window.innerHeight);
 H=vw<vh?560:450;
 W=Math.max(360,Math.round(H*(vw/vh)));
 cv.width=Math.round(W*DPR);
 cv.height=Math.round(H*DPR);
 g.setTransform(DPR,0,0,DPR,0,0);
 g.imageSmoothingEnabled=false;
}
addEventListener("resize",resize);
addEventListener("orientationchange",()=>setTimeout(resize,120));
resize();

const MAPS=[

 ]

let state="title";
let curMap=0,curChar=0,t=0,runT=0,coins=0,score=0,lives=3,big=false,invuln=0,shake=0,hitstop=0,muted=false;
let fadeA=1,screenT=0,menuHover=-1,mapHover=0,btnAnim=[0,0,0],cardAnim=[0,0,0,0,0],charAnim=[0,0,0,0],bestScores=[0,0,0,0,0];
let grid,COLS=62,qBlocks,coinObjs,mushrooms,enemies,spikes,flagX,P,camX=0,coy=0,buf=0,dashT=0,dashCd=0,msg="";
const K={l:0,r:0,u:0},SP=[],FT=[];
for(let i=0;i<110;i++)SP.push({l:0,x:0,y:0,vx:0,vy:0,c:"#fff",s:3});
const hash=n=>Math.abs(Math.sin(n*127.1)*43758.5)%1;

let ac;
function audio(){if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function tone(f,d,ty,v,sl,delay=0){
 if(!ac||muted)return;
 const o=ac.createOscillator(),n=ac.createGain(),a=ac.currentTime+delay;
 o.type=ty||"square";o.frequency.setValueAtTime(f,a);
 if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(35,f*sl),a+d);
 n.gain.setValueAtTime(v||.06,a);n.gain.exponentialRampToValueAtTime(.0001,a+d);
 o.connect(n);n.connect(ac.destination);o.start(a);o.stop(a+d);
}
const SFX={
 ui(){tone(640,.06,"square",.05,1.35)},
 quit(){tone(360,.09,"triangle",.06,.55)},
 start(){[440,554,659,880].forEach((f,i)=>tone(f,.08,"triangle",.065,1,i*.05))},
 jump(){tone(big?265:345,.12,"square",.055,1.8)},
 dash(){tone(480,.1,"triangle",.06,.55)},
 coin(){tone(988,.065,"square",.055);tone(1318,.14,"square",.055,1,.06)},
 bump(){tone(155,.08,"triangle",.07,.65)},
 breakBlk(){tone(130,.14,"sawtooth",.07,.4)},
 powerup(){[523,659,784,1046].forEach((f,i)=>tone(f,.08,"square",.06,1,i*.055))},
 stomp(){tone(215,.08,"square",.075,2.1);tone(460,.1,"triangle",.06,1.4,.04)},
 hurt(){tone(160,.24,"sawtooth",.075,.35)},
 die(){[330,277,220,146].forEach((f,i)=>tone(f,.12,"square",.065,.85,i*.085))},
 win(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.15,"triangle",.075,1,i*.085))}
};

function burst(x,y,n,c,pw=200,s=3){
 for(let i=0,k=0;i<SP.length&&k<n;i++){const p=SP[i];
  if(p.l<=0){p.l=.35+Math.random()*.35;p.x=x;p.y=y;p.vx=(Math.random()-.5)*pw;p.vy=-Math.random()*pw*.85-40;p.c=c;p.s=s;k++}}
}
function pop(x,y,txt,c="#fff"){FT.push({x,y,txt,c,l:.85})}
function goState(next){
 state=next;fadeA=1;screenT=0;
 const qBtn=document.getElementById("btnQuit");
 if(qBtn)qBtn.textContent=next==="play"?"EXIT MAP":next==="mapSelect"||next==="charSelect"?"TITLE":"QUIT";
}
function exitGame(){
 audio();SFX.quit();
 if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});
 goState("exit");
 try{window.close()}catch(e){}
}
function handleQuitAction(){
 audio();SFX.quit();
 if(state==="play"||state==="clear"||state==="over"||state==="end")goState("mapSelect");
 else if(state==="mapSelect"||state==="charSelect")goState("title");
 else if(state==="title")exitGame();
 else if(state==="exit")goState("title");
}

function loadMap(idx){
 curMap=idx;FT.length=0;qBlocks=[];coinObjs=[];mushrooms=[];enemies=[];spikes=[];flagX=null;
 const M=MAPS[idx];
 grid=M.rows.map(r=>r.split(""));
 COLS=grid[0].length;
 const h=big?38:28;
 P={x:2*T+6,y:9*T-h,w:22,h,vx:0,vy:0,onG:false,face:1};
 invuln=0;camX=0;coy=0;buf=0;dashT=0;dashCd=0;
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  const ch=grid[y][x];
  if(ch==="?")qBlocks.push({x,y,used:false,bump:0});
  else if(ch==="c"){coinObjs.push({x,y,got:false,ph:x*.5+y*.7});grid[y][x]="."}
  else if(ch==="e"){enemies.push({x:x*T+4,y:(y+1)*T-26,w:24,h:26,vx:-58-idx*6,vy:0,alive:true});grid[y][x]="."}
  else if(ch==="^"){spikes.push({x,y});grid[y][x]="."}
  else if(ch==="F")flagX=x;
 }
}

function setBig(nextBig){
 if(big===nextBig)return;
 const bot=P.y+P.h;big=nextBig;P.h=big?38:28;P.y=bot-P.h;
}
const solidCh=c=>c==="G"||c==="#"||c==="?"||c==="U"||c==="P"||c==="p"||c==="=";
function solid(tx,ty){
 if(tx<0||tx>=COLS)return true;
 if(ty<0||ty>=ROWS)return false;
 return solidCh(grid[ty][tx]);
}
const bnd=()=>[Math.floor(P.x/T),Math.floor((P.x+P.w-.01)/T),Math.floor(P.y/T),Math.floor((P.y+P.h-.01)/T)];

function doDash(){
 if(state!=="play"||dashCd>0||dashT>0)return;
 dashT=CFG.dashT;dashCd=CFG.dashCd;P.vy=0;SFX.dash();
 burst(P.x+P.w/2,P.y+P.h/2,10,"#7be0ff",170,3);
}

function hitCeiling(tx,ty){
 if(tx<0||tx>=COLS||ty<0||ty>=ROWS)return;
 const ch=grid[ty][tx];
 if(ch==="?"){
  const qb=qBlocks.find(b=>b.x===tx&&b.y===ty);
  if(qb&&!qb.used){
   qb.used=true;qb.bump=1;grid[ty][tx]="U";SFX.bump();
   burst(tx*T+16,ty*T+16,8,"#ffd166",150,3);
   if(!big&&(tx+ty)%2===0){
    mushrooms.push({x:tx*T+4,y:(ty-1)*T+4,w:24,h:24,vx:85,vy:-120,alive:true});
    pop(tx*T+16,ty*T-6,"ZEPHR SHIELD!","#ff5964");
   }else{
    coins++;score+=100;SFX.coin();
    burst(tx*T+16,ty*T-10,8,"#ffd166",120,3);
    pop(tx*T+16,ty*T-10,"+100","#ffd166");
   }
  }
 }else if(ch==="#"){
  if(big){
   grid[ty][tx]=".";score+=50;shake=4;hitstop=.025;SFX.breakBlk();
   burst(tx*T+16,ty*T+16,12,"#c86d3b",210,3);
   pop(tx*T+16,ty*T-4,"+50","#ffd166");
  }else{
   SFX.bump();burst(tx*T+16,ty*T,4,"#c86d3b",90,2);
  }
 }
}

function killPlayer(reason){
 if(invuln>0||dashT>0)return;
 if(big){
  setBig(false);invuln=1.2;shake=8;hitstop=.04;SFX.hurt();
  burst(P.x+P.w/2,P.y+P.h/2,12,"#ffd166",180,3);
  return;
 }
 lives--;SFX.die();shake=11;
 burst(P.x+P.w/2,P.y+P.h/2,18,"#ff5964",220,3);
 if(lives<=0){msg=reason||"Out of lives.";goState("over")}
 else{
  invuln=1.3;
  P.x=2*T+6;P.y=8*T-P.h;P.vx=0;P.vy=0;camX=0;
 }
}

function updatePlay(dt){
 if(hitstop>0){hitstop-=dt;return}
 runT+=dt;
 if(invuln>0)invuln-=dt;
 if(dashCd>0)dashCd-=dt;
 for(const qb of qBlocks)if(qb.bump>0)qb.bump=Math.max(0,qb.bump-dt*5.5);

 const chStats=CHARS[curChar];
 const dir=K.r-K.l;
 if(dir&&dashT<=0)P.face=dir;
 if(dashT>0){dashT-=dt;P.vx=P.face*chStats.dash;P.vy=0}
 else{P.vx=dir*chStats.spd;P.vy=Math.min(920,P.vy+CFG.grav*dt)}

 coy=P.onG?CFG.coyote:coy-dt;buf-=dt;
 if(buf>0&&coy>0){P.vy=-chStats.jmp;coy=0;buf=0;P.onG=false;SFX.jump()}

 P.x+=P.vx*dt;
 let[x0,x1,y0,y1]=bnd();
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)){
  if(P.vx>0)P.x=tx*T-P.w;else if(P.vx<0)P.x=(tx+1)*T;
 }

 const prevVy=P.vy;
 P.y+=P.vy*dt;P.onG=false;
 [x0,x1,y0,y1]=bnd();
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)){
  if(P.vy>0){P.y=ty*T-P.h;P.onG=true;P.vy=0}
  else if(P.vy<0){P.y=(ty+1)*T;P.vy=0;if(prevVy<0)hitCeiling(tx,ty)}
 }

 if(P.y>ROWS*T+20){killPlayer("Fell into the abyss.");return}

 for(const sp of spikes){
  if(P.x<sp.x*T+26&&P.x+P.w>sp.x*T+6&&P.y<sp.y*T+32&&P.y+P.h>sp.y*T+12){
   killPlayer("Hit floor spikes.");return;
  }
 }

 for(const c of coinObjs){
  if(c.got)continue;
  if(P.x<c.x*T+26&&P.x+P.w>c.x*T+6&&P.y<c.y*T+26&&P.y+P.h>c.y*T+6){
   c.got=true;coins++;score+=100;SFX.coin();
   burst(c.x*T+16,c.y*T+16,7,"#ffd166",120,2);
   pop(c.x*T+16,c.y*T-4,"+100","#ffd166");
  }
 }

 for(const m of mushrooms){
  if(!m.alive)continue;
  m.vy=Math.min(850,m.vy+CFG.grav*dt);
  m.x+=m.vx*dt;
  const mx0=Math.floor(m.x/T),mx1=Math.floor((m.x+m.w-.01)/T),my0=Math.floor(m.y/T),my1=Math.floor((m.y+m.h-.01)/T);
  for(let ty=my0;ty<=my1;ty++)for(let tx=mx0;tx<=mx1;tx++)if(solid(tx,ty)){
   if(m.vx>0)m.x=tx*T-m.w;else if(m.vx<0)m.x=(tx+1)*T;
   m.vx*=-1;
  }
  m.y+=m.vy*dt;
  const fy=Math.floor((m.y+m.h)/T),fx=Math.floor((m.x+m.w/2)/T);
  if(m.vy>0&&solid(fx,fy)){m.y=fy*T-m.h;m.vy=0}
  if(P.x<m.x+m.w&&P.x+P.w>m.x&&P.y<m.y+m.h&&P.y+P.h>m.y){
   m.alive=false;setBig(true);score+=500;SFX.powerup();
   burst(m.x+12,m.y+12,14,"#ff5964",180,3);
   pop(P.x+11,P.y-8,"SUPER "+chStats.name.split(" ")[1].toUpperCase()+"!","#7be0ff");
  }
 }

 for(const e of enemies){
  if(!e.alive)continue;
  e.vy=Math.min(900,e.vy+CFG.grav*dt);
  e.x+=e.vx*dt;
  const gx=Math.floor((e.x+(e.vx>0?e.w:0))/T),gy=Math.floor((e.y+e.h/2)/T);
  const bx=Math.floor((e.x+(e.vx>0?e.w:0))/T),by=Math.floor((e.y+e.h+4)/T);
  if(solid(gx,gy)||!solid(bx,by))e.vx*=-1;
  e.y+=e.vy*dt;
  const fy=Math.floor((e.y+e.h)/T),fx=Math.floor((e.x+e.w/2)/T);
  if(e.vy>0&&solid(fx,fy)){e.y=fy*T-e.h;e.vy=0}
  if(e.y>ROWS*T+20){e.alive=false;continue}

  if(P.x<e.x+e.w&&P.x+P.w>e.x&&P.y<e.y+e.h&&P.y+P.h>e.y){
   if(prevVy>0&&P.y+P.h-prevVy*dt<=e.y+12){
    e.alive=false;P.y=e.y-P.h-1;P.vy=-CFG.stomp;P.onG=false;score+=200;hitstop=.03;SFX.stomp();
    burst(e.x+e.w/2,e.y+e.h/2,12,"#c86d3b",190,3);
    pop(e.x+12,e.y-6,"+200","#ffd166");
   }else{

  const step=Math.sin(t*14+e.x)*2.5;
  g.fillStyle="#2b190e";g.fillRect(e.x+2+step*.5,e.y+e.h-6,7,6);g.fillRect(e.x+e.w-9-step*.5,e.y+e.h-6,7,6);
  g.fillStyle="#9e2a2b";g.fillRect(e.x,e.y+2,e.w,e.h-7);
  g.fillStyle="#fff";g.fillRect(e.x+4,e.y+7,5,6);g.fillRect(e.x+15,e.y+7,5,6);
  g.fillStyle="#111";g.fillRect(e.x+(e.vx>0?7:5),e.y+9,2,4);g.fillRect(e.x+(e.vx>0?17:15),e.y+9,2,4);
 }

 if(P&&(invuln<=0||Math.floor(t*22)%2===0)){
  const sw=P.onG&&Math.abs(P.vx)>5?Math.sin(t*18)*2:0;
  const sz=big?38:30;
  drawCharacterSprite(P.x-(sz-P.w)/2,P.y-(sz-P.h),sz,P.face,sw,curChar);
 }

 for(const p of SP)if(p.l>0){g.fillStyle=p.c;g.fillRect(p.x,p.y,p.s,p.s)}
 g.font="700 13px system-ui,sans-serif";g.textAlign="center";
 for(const ft of FT){g.fillStyle=ft.c;g.fillText(ft.txt,ft.x,ft.y)}
 g.restore();
}

function drawHUD(){
 g.textAlign="left";g.font="800 14px 'Courier New',monospace";g.fillStyle="#fff";
 g.fillText(MAPS[curMap].name+" · "+CHARS[curChar].name.split(" ")[1],14,22);
 g.fillStyle="#ffd166";g.fillText("COINS ×"+coins+"  ♥×"+lives+(big?"  SUPER":""),14,42);
 g.fillStyle="#a5b4fc";g.fillText("SCORE "+String(score).padStart(5,"0"),14,62);
}

function drawModal(title,lines,sub){
 g.fillStyle="rgba(14,15,28,.82)";g.fillRect(0,0,W,H);g.textAlign="center";
 g.fillStyle="#ffd166";g.font="900 32px 'Courier New',monospace";g.fillText(title,W/2,H*.34);
 g.fillStyle="#fff";g.font="600 16px system-ui,sans-serif";lines.forEach((l,i)=>g.fillText(l,W/2,H*.46+i*28));
 g.fillStyle="#a5b4fc";g.font="700 14px 'Courier New',monospace";g.fillText(sub,W/2,H*.46+lines.length*28+28);
}

function draw(){
 if(state==="title")drawTitleScreen();
 else if(state==="mapSelect")drawMapSelect();
 else if(state==="charSelect")drawCharSelect();
 else if(state==="exit")drawModal("THANKS FOR PLAYING",["Zephrs Game session closed.","You may close this tab or return to Title."],"Tap or press SPACE to return to Title");
 else{
  drawWorld();
  if(state==="play")drawHUD();
  else if(state==="clear")drawModal("STAGE CLEARED!",["Score: "+score+" · Coins: "+coins],"Tap or press SPACE for Map Select");
  else if(state==="over")drawModal(msg||"GAME OVER",["Score: "+score+" · Coins: "+coins],"Tap to retry · EXIT MAP button for Map Select");
  else if(state==="end")drawModal("ALL 5 MAPS CONQUERED!",["Final Score: "+score+" · Time: "+runT.toFixed(1)+"s"],"Tap or press SPACE for Map Select");
 }
 if(fadeA>0){
  g.fillStyle=`rgba(16,17,32,${fadeA.toFixed(3)})`;
  g.fillRect(0,0,W,H);
 }
}

let last=0;
function frame(ts){
 const dt=Math.min(.033,(ts-last)/1000||0);last=ts;t+=dt;screenT+=dt;
 if(fadeA>0)fadeA=Math.max(0,fadeA-dt*2.8);
 if(state==="play")updatePlay(dt);
 if(shake>0)shake=Math.max(0,shake-dt*32);
 for(const p of SP)if(p.l>0){p.l-=dt;p.vy+=820*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
 for(let i=FT.length-1;i>=0;i--){FT[i].y-=28*dt;FT[i].l-=dt;if(FT[i].l<=0)FT.splice(i,1)}
 draw();requestAnimationFrame(frame);
}

function launchMap(idx){
 audio();SFX.start();
 runT=0;coins=0;score=0;lives=3;big=false;
 loadMap(idx);goState("play");
}

function getCanvasPos(e){
 const r=cv.getBoundingClientRect();
 const cx=e.touches?e.touches[0].clientX:e.clientX;
 const cy=e.touches?e.touches[0].clientY:e.clientY;
 return{x:(cx-r.left)*W/r.width,y:(cy-r.top)*H/r.height};
}

function handleMenuMove(pt){
 if(state==="title"){
  const bw=Math.min(340,W-60),bh=28,bx=(W-bw)/2,by0=H*.71,by1=by0+34,by2=by1+34;
  if(pt.x>=bx&&pt.x<=bx+bw&&pt.y>=by0&&pt.y<=by0+bh)menuHover=0;
  else if(pt.x>=bx&&pt.x<=bx+bw&&pt.y>=by1&&pt.y<=by1+bh)menuHover=1;
  else if(pt.x>=bx&&pt.x<=bx+bw&&pt.y>=by2&&pt.y<=by2+bh)menuHover=2;
  else menuHover=-1;
 }else if(state==="mapSelect"){
  getMapCardRects().forEach((r,i)=>{if(pt.x>=r.x&&pt.x<=r.x+r.w&&pt.y>=r.y&&pt.y<=r.y+r.h)mapHover=i});
 }else if(state==="charSelect"){
  getCharCardRects().forEach((r,i)=>{if(pt.x>=r.x&&pt.x<=r.x+r.w&&pt.y>=r.y&&pt.y<=r.y+r.h)curChar=i});
 }
}

function handleMenuClick(pt){
 audio();
 if(state==="title"){
  const bw=Math.min(340,W-60),bh=28,bx=(W-bw)/2,by0=H*.71,by1=by0+34,by2=by1+34;
  if(pt.x>=bx&&pt.x<=bx+bw&&pt.y>=by2&&pt.y<=by2+bh){exitGame();return}
  if(pt.x>=bx&&pt.x<=bx+bw&&pt.y>=by1&&pt.y<=by1+bh){SFX.ui();goState("charSelect");return}
  SFX.ui();goState("mapSelect");
 }else if(state==="charSelect"){
  if(pt.y>H-52){SFX.ui();goState("title");return}
  const rects=getCharCardRects();
  for(let i=0;i<rects.length;i++){
   const r=rects[i];
   if(pt.x>=r.x&&pt.x<=r.x+r.w&&pt.y>=r.y&&pt.y<=r.y+r.h){curChar=i;SFX.ui();return}
  }
 }else if(state==="mapSelect"){
  if(pt.y>H-52){SFX.quit();goState("title");return}
  const rects=getMapCardRects();
  for(let i=0;i<rects.length;i++){
   const r=rects[i];
   if(pt.x>=r.x&&pt.x<=r.x+r.w&&pt.y>=r.y&&pt.y<=r.y+r.h){launchMap(i);return}
  }
 }else if(state==="clear"||state==="end"){
  SFX.ui();goState("mapSelect");
 }else if(state==="over"){
  launchMap(curMap);
 }else if(state==="exit"){
  SFX.ui();goState("title");
 }else if(state==="play"){
  buf=CFG.buf;
 }
}

cv.addEventListener("mousemove",e=>handleMenuMove(getCanvasPos(e)));
cv.addEventListener("mousedown",e=>handleMenuClick(getCanvasPos(e)));
cv.addEventListener("touchstart",e=>{e.preventDefault();const p=getCanvasPos(e);handleMenuMove(p);handleMenuClick(p)},{passive:false});

addEventListener("keydown",e=>{
 if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();
 if(e.code==="KeyM"){muted=!muted;document.getElementById("btnMute").textContent=muted?"SFX: OFF":"SFX: ON";return}
 if(e.repeat)return;
 if(state==="title"){
  if(e.code==="ArrowDown")menuHover=(menuHover+1+3)%3;
  if(e.code==="ArrowUp")menuHover=(menuHover-1+3)%3;
  if(e.code==="KeyQ"||e.code==="Escape"){exitGame();return}
  if(e.code==="Space"||e.code==="Enter"){
   audio();
   if(menuHover===2)exitGame();
   else if(menuHover===1){SFX.ui();goState("charSelect")}
   else{SFX.ui();goState("mapSelect")}
  }
  return;
 }
 if(state==="charSelect"){
  if(e.code==="Escape"||e.code==="KeyQ"){SFX.ui();goState("title");return}
  if(e.code==="ArrowRight"||e.code==="KeyD"){curChar=(curChar+1)%CHARS.length;SFX.ui()}
  if(e.code==="ArrowLeft"||e.code==="KeyA"){curChar=(curChar+CHARS.length-1)%CHARS.length;SFX.ui()}
  if(e.code==="Space"||e.code==="Enter"){SFX.ui();goState("mapSelect")}
  return;
 }
 if(state==="mapSelect"){
  if(e.code==="Escape"||e.code==="KeyQ"){SFX.quit();goState("title");return}
  if(e.code==="ArrowRight"||e.code==="KeyD"){mapHover=(mapHover+1)%MAPS.length;SFX.ui()}
  if(e.code==="ArrowLeft"||e.code==="KeyA"){mapHover=(mapHover+MAPS.length-1)%MAPS.length;SFX.ui()}
  if(e.code==="Space"||e.code==="Enter")launchMap(mapHover);
  return;
 }
 if(e.code==="Escape"||e.code==="KeyQ"){handleQuitAction();return}
 if(e.code==="ArrowLeft"||e.code==="KeyA")K.l=1;
 if(e.code==="ArrowRight"||e.code==="KeyD")K.r=1;
 if(e.code==="ShiftLeft"||e.code==="ShiftRight"||e.code==="KeyK")doDash();
 if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){
  audio();
  if(state==="play")buf=CFG.buf;
  else if(state==="clear"||state==="end")goState("mapSelect");
  else if(state==="over")launchMap(curMap);
  else if(state==="exit")goState("title");
 }
 if(e.code==="KeyR"&&state==="play")launchMap(curMap);
});
addEventListener("keyup",e=>{
 if(e.code==="ArrowLeft"||e.code==="KeyA")K.l=0;
 if(e.code==="ArrowRight"||e.code==="KeyD")K.r=0;
 if((e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")&&state==="play"&&P.vy<0)P.vy*=.45;
});

function bindPad(id,onDown,onUp){
 const el=document.getElementById(id);
 const start=e=>{e.preventDefault();audio();el.classList.add("act");onDown()};
 const end=e=>{e.preventDefault();el.classList.remove("act");if(onUp)onUp()};
 el.addEventListener("touchstart",start,{passive:false});
 el.addEventListener("touchend",end,{passive:false});
 el.addEventListener("touchcancel",end,{passive:false});
 el.addEventListener("mousedown",start);
 el.addEventListener("mouseup",end);
 el.addEventListener("mouseleave",end);
}
bindPad("bLeft",()=>{K.l=1},()=>{K.l=0});
bindPad("bRight",()=>{K.r=1},()=>{K.r=0});
bindPad("bJump",()=>{if(state==="play")buf=CFG.buf;else handleMenuClick({x:W/2,y:H*.73})},()=>{if(state==="play"&&P.vy<0)P.vy*=.45});
bindPad("bDash",()=>{doDash()});

document.getElementById("btnChar").onclick=()=>{audio();SFX.ui();goState(state==="charSelect"?"title":"charSelect")};
document.getElementById("btnTouch").onclick=()=>{touchUI.classList.toggle("on")};
document.getElementById("btnMute").onclick=()=>{muted=!muted;document.getElementById("btnMute").textContent=muted?"SFX: OFF":"SFX: ON"};
document.getElementById("btnFull").onclick=()=>{
 if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});
 else document.exitFullscreen?.();
};
document.getElementById("btnQuit").onclick=handleQuitAction;

requestAnimationFrame(frame);
</script>
</body>
</html>
