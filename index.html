<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zephrys</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #191a2e; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById("c"), ctx = c.getContext("2d");
const ground = 360, p = { x: 60, y: ground - 24, w: 20, h: 24 };

function fit() { c.width = innerWidth; c.height = innerHeight; }
addEventListener("resize", fit); fit();

function draw() {
  ctx.fillStyle = "#191a2e"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = "#38b000"; ctx.fillRect(0, ground, c.width, c.height - ground);
  ctx.fillStyle = "#e03131"; ctx.fillRect(p.x, p.y, p.w, p.h);
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
