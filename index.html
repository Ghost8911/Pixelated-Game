<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zephrys</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #191a2e; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById("c"), ctx = c.getContext("2d");
const ground = 360, grav = 1600;
const plat = { x: 220, y: 270, w: 120, h: 18 };
const p = { x: 60, y: ground - 24, w: 20, h: 24, speed: 220, vy: 0, grounded: true };
const keys = {};

addEventListener("resize", () => { c.width = innerWidth; c.height = innerHeight; });
addEventListener("keydown", e => { keys[e.code] = true; });
addEventListener("keyup", e => { keys[e.code] = false; });
c.width = innerWidth; c.height = innerHeight;

function loop() {
  const dt = 1 / 60;
  const dir = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  p.x = Math.max(0, Math.min(c.width - p.w, p.x + dir * p.speed * dt));

  if ((keys.Space || keys.ArrowUp || keys.KeyW) && p.grounded) {
    p.vy = -620;
    p.grounded = false;
  }
  const prevY = p.y;
  p.vy += grav * dt;
  p.y += p.vy * dt;
  p.grounded = false;

  if (p.y >= ground - p.h) {
    p.y = ground - p.h;
    p.vy = 0;
    p.grounded = true;
  }
  if (p.vy >= 0 && prevY + p.h <= plat.y && p.y + p.h >= plat.y && p.x + p.w > plat.x && p.x < plat.x + plat.w) {
    p.y = plat.y - p.h;
    p.vy = 0;
    p.grounded = true;
  }

  ctx.fillStyle = "#191a2e"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = "#38b000"; ctx.fillRect(0, ground, c.width, c.height - ground);
  ctx.fillStyle = "#b85d2b"; ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
  ctx.fillStyle = "#e03131"; ctx.fillRect(p.x, p.y, p.w, p.h);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
