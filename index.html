<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Zephrys</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; position: fixed; inset: 0;
    width: 100vw; height: 100dvh; background: #191a2e;
    overflow: hidden; touch-action: none; font-family: "Courier New", monospace;
  }
  canvas { display: block; width: 100vw; height: 100dvh; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const TILE = 32;
const ROWS = 14;
const GRAVITY = 1750;
const STOMP_BOUNCE = 490;
const DASH_DURATION = 0.14;
const DASH_COOLDOWN = 0.62;

let viewW = 800;
let viewH = 450;
let clock = 0;

function fitScreen() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, window.innerWidth);
  const h = Math.max(1, window.innerHeight);
  viewH = w < h ? 560 : 450;
  viewW = Math.max(360, Math.round(viewH * (w / h)));
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener("resize", fitScreen);
fitScreen();

let lives = 3;
let score = 0;
let coins = 0;
let invulnTimer = 0;
let dashTimer = 0;
let dashCooldown = 0;
let coyoteTimer = 0;
let jumpBuffer = 0;
let camX = 0;
let colsCount = 24;

let grid = Array.from({ length: ROWS }, (_, r) =>
  Array.from({ length: colsCount }, (__, c) => (r >= 12 ? "G" : "."))
);

let player = {
  x: 2 * TILE + 6,
  y: 9 * TILE - 28,
  w: 22,
  h: 28,
  vx: 0,
  vy: 0,
  onGround: false,
  facing: 1
};

let items = [
  { x: 6, y: 10, coin: true, taken: false },
  { x: 8, y: 10, coin: true, taken: false }
];
let enemies = [
  { x: 9 * TILE + 4, y: 12 * TILE - 26, w: 24, h: 26, vx: -60, vy: 0, alive: true }
];
let spikes = [
  { x: 14, y: 11 }
];

const activeHero = { speed: 225, jump: 695, dash: 510 };
const keys = { left: false, right: false };

function isSolidTile(ch) {
  return ch === "G" || ch === "#" || ch === "?" || ch === "U" || ch === "P" || ch === "p" || ch === "=";
}

function solidAt(tx, ty) {
  if (tx < 0 || tx >= colsCount) return true;
  if (ty < 0 || ty >= ROWS) return false;
  return isSolidTile(grid[ty][tx]);
}

function respawnInStage() {
  invulnTimer = 1.3;
  player.x = 2 * TILE + 6;
  player.y = 8 * TILE - player.h;
  player.vx = 0;
  player.vy = 0;
  camX = 0;
}

function hurtPlayer() {
  if (invulnTimer > 0 || dashTimer > 0) return;
  lives--;
  if (lives <= 0) {
    lives = 3;
    score = 0;
    coins = 0;
  }
  respawnInStage();
}

function movePlayer(dt) {
  if (invulnTimer > 0) invulnTimer -= dt;
  if (dashCooldown > 0) dashCooldown -= dt;

  const moveDir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (moveDir !== 0 && dashTimer <= 0) player.facing = moveDir;

  if (dashTimer > 0) {
    dashTimer -= dt;
    player.vx = player.facing * activeHero.dash;
    player.vy = 0;
  } else {
    player.vx = moveDir * activeHero.speed;
    player.vy = Math.min(920, player.vy + GRAVITY * dt);
  }

  coyoteTimer = player.onGround ? 0.11 : coyoteTimer - dt;
  jumpBuffer -= dt;
  if (jumpBuffer > 0 && coyoteTimer > 0) {
    player.vy = -activeHero.jump;
    coyoteTimer = 0;
    jumpBuffer = 0;
    player.onGround = false;
  }

  player.x += player.vx * dt;
  let x0 = Math.floor(player.x / TILE);
  let x1 = Math.floor((player.x + player.w - 0.01) / TILE);
  let y0 = Math.floor(player.y / TILE);
  let y1 = Math.floor((player.y + player.h - 0.01) / TILE);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (solidAt(tx, ty)) {
        if (player.vx > 0) player.x = tx * TILE - player.w;
        else if (player.vx < 0) player.x = (tx + 1) * TILE;
      }
    }
  }

  const prevVy = player.vy;
  player.y += player.vy * dt;
  player.onGround = false;
  x0 = Math.floor(player.x / TILE);
  x1 = Math.floor((player.x + player.w - 0.01) / TILE);
  y0 = Math.floor(player.y / TILE);
  y1 = Math.floor((player.y + player.h - 0.01) / TILE);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (solidAt(tx, ty)) {
        if (player.vy > 0) {
          player.y = ty * TILE - player.h;
          player.onGround = true;
          player.vy = 0;
        } else if (player.vy < 0) {
          player.y = (ty + 1) * TILE;
          player.vy = 0;
        }
      }
    }
  }

  if (player.y > ROWS * TILE + 20) hurtPlayer();
  camX = Math.max(0, Math.min(colsCount * TILE - viewW, player.x - viewW * 0.35));
  return prevVy;
}

function stepEntities(dt, prevVy) {
  for (const it of items) {
    if (!it.coin || it.taken) continue;
    if (
      player.x < it.x * TILE + 26 && player.x + player.w > it.x * TILE + 6 &&
      player.y < it.y * TILE + 26 && player.y + player.h > it.y * TILE + 6
    ) {
      it.taken = true;
      coins++;
      score += 100;
    }
  }

  for (const sp of spikes) {
    if (
      player.x < sp.x * TILE + 26 && player.x + player.w > sp.x * TILE + 6 &&
      player.y < sp.y * TILE + 32 && player.y + player.h > sp.y * TILE + 12
    ) {
      hurtPlayer();
      return;
    }
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    e.vy = Math.min(900, e.vy + GRAVITY * dt);
    e.x += e.vx * dt;
    const aheadX = Math.floor((e.x + (e.vx > 0 ? e.w : 0)) / TILE);
    const midY = Math.floor((e.y + e.h / 2) / TILE);
    const belowY = Math.floor((e.y + e.h + 4) / TILE);
    if (solidAt(aheadX, midY) || !solidAt(aheadX, belowY)) e.vx *= -1;

    e.y += e.vy * dt;
    const fy = Math.floor((e.y + e.h) / TILE);
    const fx = Math.floor((e.x + e.w / 2) / TILE);
    if (e.vy > 0 && solidAt(fx, fy)) { e.y = fy * TILE - e.h; e.vy = 0; }

    if (
      player.x < e.x + e.w && player.x + player.w > e.x &&
      player.y < e.y + e.h && player.y + player.h > e.y
    ) {
      const stomping = prevVy > 0 && (player.y + player.h - prevVy * dt <= e.y + 12);
      if (stomping) {
        e.alive = false;
        player.y = e.y - player.h - 1;
        player.vy = -STOMP_BOUNCE;
        player.onGround = false;
        score += 200;
      } else {
        hurtPlayer();
        return;
      }
    }
  }
}

window.addEventListener("keydown", e => {
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") jumpBuffer = 0.11;
});
window.addEventListener("keyup", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
  if ((e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") && player.vy < 0) {
    player.vy *= 0.45;
  }
});

function updateLoop(dt) {
  clock += dt;
  const prevVy = movePlayer(dt);
  stepEntities(dt, prevVy);
}

function renderLoop() {
  ctx.fillStyle = "#191a2e";
  ctx.fillRect(0, 0, viewW, viewH);

  ctx.save();
  ctx.translate(-camX, viewH - ROWS * TILE);
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < colsCount; x++) {
      if (grid[y][x] === "G") {
        ctx.fillStyle = "#8b542b";
        ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
        ctx.fillStyle = "#38b000";
        ctx.fillRect(x * TILE, y * TILE, TILE, 8);
      }
    }
  }

  for (const it of items) {
    if (!it.coin || it.taken) continue;
    ctx.fillStyle = "#ffd166";
    ctx.beginPath();
    ctx.arc(it.x * TILE + 16, it.y * TILE + 16, 8, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const sp of spikes) {
    ctx.fillStyle = "#cbd5e1";
    ctx.beginPath();
    ctx.moveTo(sp.x * TILE + 4, (sp.y + 1) * TILE);
    ctx.lineTo(sp.x * TILE + 16, sp.y * TILE + 12);
    ctx.lineTo(sp.x * TILE + 28, (sp.y + 1) * TILE);
    ctx.fill();
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    ctx.fillStyle = "#9e2a2b";
    ctx.fillRect(e.x, e.y + 2, e.w, e.h - 4);
    ctx.fillStyle = "#fff";
    ctx.fillRect(e.x + 5, e.y + 8, 4, 4);
    ctx.fillRect(e.x + 15, e.y + 8, 4, 4);
  }

  ctx.fillStyle = "#e03131";
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.restore();

  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px monospace";
  ctx.fillText(`LIVES x${lives}  COINS x${coins}  SCORE ${score}`, 14, 24);
}

let prevTime = 0;
function loop(now) {
  const dt = Math.min(0.033, (now - prevTime) / 1000 || 0);
  prevTime = now;
  updateLoop(dt);
  renderLoop();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
