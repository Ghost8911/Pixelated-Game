<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pixelated-game · Knight</title>
<style>
html,body{margin:0;height:100%;background:#090810;overflow:hidden;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,calc(100vh*25/14));height:auto;aspect-ratio:25/14;background:#000;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c" width="800" height="448"></canvas>
<script>
"use strict";
const cv=document.getElementById("c"),g=cv.getContext("2d");
const T=32,COLS=46,ROWS=14,W=800,H=448;
const CFG={speed:215,grav:1850,jump:625,dashSpd:540,dashT:.15,dashCd:.55,atkT:.16,atkCd:.26,coyote:.11,buf:.11,player:{w:22,h:40}};

/* Surface legend:
   . air | # stone ledge | D grass ledge | ^ spikes | E enemy | G shrine/goal */
const STAGES=[
{n:"Sunlit Ridge",sky:["#3b8ec9","#cdeeff"],hint:"A/D move · W/Space jump · Shift/K dash · J/Click slash · Defeat foes & reach the shrine.",map:[
 "..............................................",
 "..............................................",
 "..............................................",
 "..............................................",
 ".................###.......###................",
 "..............................................",
 "..........###........................###......",
 ".............................E................",
 "....................###.....###.........G.....",
 ".......E......................................",
 "DDDDDDDDDD........^..^..........DDDDDDDDDDDDDD",
 "##########......########........##############",
 "##########......########........##############",
 "##########......########........##############"
]},
{n:"Amber Causeway",sky:["#2b3a67","#f39c6b"],hint:"Watch the spikes and time your dash & sword slashes across the causeway.",map:[
 "..............................................",
 "..............................................",
 "..............................................",
 "..........................###.................",
 "............###...............................",
 "..................................###.........",
 ".......###...............E....................",
 ".......................#####..................",
 "..............E.................E.......G.....",
 ".............###...............###............",
 "DDDDDDD..^..^.....DDDDDDD..^..^...DDDDDDDDDDDD",
 "#######.######....#######.######..############",
 "#######.######....#######.######..############",
 "#######.######....#######.######..############"
]},
{n:"Twilight Keep",sky:["#141326","#5b2c6f"],hint:"Final surface stretch—clear the vanguard and claim the twilight shrine.",map:[
 "..............................................",
 "..............................................",
 "..............................................",
 ".................###....###...................",
 "..............................................",
 ".........###..................###.............",
 "....................E.........................",
 "...................###.........E..............",
 "........E.....................###.......G.....",
 ".......###....................................",
 "DDDDDD..^..^..DDDDDD..^..^..DDDDDDDDDDDDDDDDDD",
 "######.######.######.######.##################",
 "######.######.######.######.##################",
 "######.######.######.######.##################"
]}
];

let state="title",stage=0,t=0,runT=0,hp=5,maxHp=5,score=0,shake=0,hitstop=0,muted=false;
let grid,spikes,enemies,shrine,P,camX=0,coy=0,buf=0,dashT=0,dashCd=0,atkT=0,atkCd=0,msg="";
const K={l:0,r:0,u:0},SP=[],FT=[];
for(let i=0;i<90;i++)SP.push({l:0,x:0,y:0,vx:0,vy:0,c:"#fff",s:3});
const hash=n=>Math.abs(Math.sin(n*127.1)*43758.5)%1;

let ac,nb;
function audio(){if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function tone(f,d,ty,v,sl,delay=0){
 if(!ac||muted)return;
 const o=ac.createOscillator(),n=ac.createGain(),a=ac.currentTime+delay;
 o.type=ty||"square";o.frequency.setValueAtTime(f,a);
 if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(35,f*sl),a+d);
 n.gain.setValueAtTime(v||.07,a);n.gain.exponentialRampToValueAtTime(.0001,a+d);
 o.connect(n);n.connect(ac.destination);o.start(a);o.stop(a+d);
}
function noise(d,f,v,q){
 if(!ac||muted)return;
 if(!nb){nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),n=ac.createGain(),a0=ac.currentTime;
 s.buffer=nb;fl.type="bandpass";fl.frequency.value=f;fl.Q.value=q||1;
 n.gain.setValueAtTime(v,a0);n.gain.exponentialRampToValueAtTime(.0001,a0+d);
 s.connect(fl);fl.connect(n);n.connect(ac.destination);s.start(a0,Math.random()*.5);s.stop(a0+d);
}
const SFX={
 jump(){tone(320,.11,"square",.055,1.8)},
 dash(){noise(.12,1400,.25,1.4);tone(520,.09,"triangle",.06,.6)},
 slash(){noise(.11,1800,.3,1.8);tone(420,.08,"sawtooth",.05,.45)},
 hit(){noise(.16,520,.35,1);tone(160,.14,"square",.08,1.5)},
 hurt(){noise(.28,240,.42,.9);tone(145,.28,"sawtooth",.085,.35)},
 win(){[523,659,784,1046].forEach((f,i)=>tone(f,.15,"triangle",.08,1,i*.09))}
};

function burst(x,y,n,c,pw=200,s=3){
 for(let i=0,k=0;i<SP.length&&k<n;i++){const p=SP[i];
  if(p.l<=0){p.l=.35+Math.random()*.35;p.x=x;p.y=y;p.vx=(Math.random()-.5)*pw;p.vy=-Math.random()*pw*.8-35;p.c=c;p.s=s;k++}}
}
function pop(x,y,txt,c="#ffd166"){FT.push({x,y,txt,c,l:.8})}

function loadStage(i){
 stage=i;FT.length=0;spikes=[];enemies=[];shrine=null;
 grid=STAGES[i].map.map(r=>r.split(""));
 P={x:2*T+5,y:8*T,w:CFG.player.w,h:CFG.player.h,vx:0,vy:0,onG:false,face:1,invuln:0};
 camX=0;dashT=0;dashCd=0;atkT=0;atkCd=0;
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  const ch=grid[y][x];
  if(ch==="^"){spikes.push({x,y});grid[y][x]="."}
  else if(ch==="E"){enemies.push({x:x*T+4,y:(y+1)*T-28,w:24,h:28,vx:-55,vy:0,hp:2,alive:true,hitT:0});grid[y][x]="."}
  else if(ch==="G"){shrine={x,y};grid[y][x]="."}
 }
}

const isSolid=ch=>ch==="#"||ch==="D";
function solid(tx,ty){
 if(tx<0||tx>=COLS)return true;
 if(ty<0)return false;
 if(ty>=ROWS)return false;
 return isSolid(grid[ty][tx]);
}
const bnd=()=>[Math.floor(P.x/T),Math.floor((P.x+P.w-.01)/T),Math.floor(P.y/T),Math.floor((P.y+P.h-.01)/T)];

function doSlash(){
 if(atkCd>0||state!=="play")return;
 atkT=CFG.atkT;atkCd=CFG.atkCd;SFX.slash();
 const sx=P.face>0?P.x+P.w:P.x-34,sy=P.y+4,sw=34,shh=32;
 burst(sx+sw/2,sy+shh/2,6,"#b8f2ff",140,2);
 for(const e of enemies){
  if(!e.alive)continue;
  if(sx<e.x+e.w&&sx+sw>e.x&&sy<e.y+e.h&&sy+shh>e.y){
   e.hp--;e.hitT=.14;e.vx=P.face*220;e.vy=-160;
   hitstop=.045;shake=5;SFX.hit();
   burst(e.x+e.w/2,e.y+e.h/2,10,"#ffd166",190,3);
   if(e.hp<=0){e.alive=false;score+=150;pop(e.x+e.w/2,e.y-6,"+150")}
   else pop(e.x+e.w/2,e.y-6,"HIT!","#ff9f1c");
  }
 }
}

function doDash(){
 if(dashCd>0||dashT>0||state!=="play")return;
 dashT=CFG.dashT;dashCd=CFG.dashCd;P.vy=0;SFX.dash();
 burst(P.x+P.w/2,P.y+P.h/2,8,"#7be0ff",150,3);
}

function hurtPlayer(reason){
 if(P.invuln>0||dashT>0)return;
 hp--;P.invuln=.9;shake=9;SFX.hurt();
 burst(P.x+P.w/2,P.y+P.h/2,12,"#ff5964",200,3);
 if(hp<=0){state="over";msg=reason||"Fallen on the surface."}
}

function update(dt){
 if(hitstop>0){hitstop-=dt;return}
 runT+=dt;
 if(dashCd>0)dashCd-=dt;
 if(atkCd>0)atkCd-=dt;
 if(atkT>0)atkT-=dt;
 if(P.invuln>0)P.invuln-=dt;

 const dir=K.r-K.l;
 if(dir&&dashT<=0)P.face=dir;
 if(dashT>0){dashT-=dt;P.vx=P.face*CFG.dashSpd;P.vy=0}
 else{P.vx=dir*CFG.speed;P.vy=Math.min(920,P.vy+CFG.grav*dt)}

 coy=P.onG?CFG.coyote:coy-dt;buf-=dt;
 if(buf>0&&coy>0){P.vy=-CFG.jump;coy=0;buf=0;P.onG=false;SFX.jump()}

 P.x+=P.vx*dt;
 let[x0,x1,y0,y1]=bnd();
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)){
  if(P.vx>0)P.x=tx*T-P.w;else if(P.vx<0)P.x=(tx+1)*T;
 }

 P.y+=P.vy*dt;P.onG=false;
 [x0,x1,y0,y1]=bnd();
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)){
  if(P.vy>0){P.y=ty*T-P.h;P.onG=true}else if(P.vy<0)P.y=(ty+1)*T;
  P.vy=0;
 }

 if(P.y>H+24){hurtPlayer("Fell into the abyss.");if(state==="over")return;P.x=2*T+5;P.y=7*T;P.vx=P.vy=0}

 for(const sp of spikes){
  if(P.x<sp.x*T+26&&P.x+P.w>sp.x*T+6&&P.y<sp.y*T+32&&P.y+P.h>sp.y*T+12){
   hurtPlayer("Impaled by spikes.");if(state==="over")return;
  }
 }

 for(const e of enemies){
  if(!e.alive)continue;
  if(e.hitT>0)e.hitT-=dt;
  e.vy=Math.min(900,e.vy+CFG.grav*dt);
  e.x+=e.vx*dt;
  const gx=Math.floor((e.x+(e.vx>0?e.w:0))/T),gy=Math.floor((e.y+e.h/2)/T),belowX=Math.floor((e.x+(e.vx>0?e.w:0))/T),belowY=Math.floor((e.y+e.h+4)/T);
  if(solid(gx,gy)||!solid(belowX,belowY))e.vx*=-1;
  e.y+=e.vy*dt;
  const fy=Math.floor((e.y+e.h)/T),fx=Math.floor((e.x+e.w/2)/T);
  if(e.vy>0&&solid(fx,fy)){e.y=fy*T-e.h;e.vy=0}
  if(e.y>H+20){e.alive=false;continue}

  if(P.x<e.x+e.w&&P.x+P.w>e.x&&P.y<e.y+e.h&&P.y+P.h>e.y){
   if(P.vy>0&&P.y+P.h-P.vy*dt<=e.y+10){
    e.hp--;e.hitT=.14;P.vy=-430;SFX.hit();
    burst(e.x+e.w/2,e.y,9,"#ffd166",170,3);
    if(e.hp<=0){e.alive=false;score+=150;pop(e.x+e.w/2,e.y-6,"+150")}
   }else{
    hurtPlayer("Slain on patrol.");if(state==="over")return;
   }
  }
 }

 if(shrine&&P.x<shrine.x*T+32&&P.x+P.w>shrine.x*T&&P.y<shrine.y*T+32&&P.y+P.h>shrine.y*T){
  score+=250;SFX.win();
  state=stage===STAGES.length-1?"end":"clear";
 }

 camX=Math.max(0,Math.min(COLS*T-W,P.x-W*.38));
}

function drawSky(){
 const s=STAGES[stage];
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,s.sky[0]);gr.addColorStop(1,s.sky[1]);
 g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle="rgba(255,245,190,.28)";g.beginPath();g.arc(650,74,42,0,7);g.fill();
 g.fillStyle="rgba(255,255,255,.78)";
 for(let i=0;i<6;i++){const cx=(((i*240-camX*.18)%1500)+1500)%1500-160,cy=42+(i%3)*28;g.fillRect(cx,cy,84,16);g.fillRect(cx+18,cy-10,46,12)}
 g.fillStyle="rgba(30,36,58,.28)";g.beginPath();g.moveTo(0,H);
 for(let x=0;x<=W;x+=20)g.lineTo(x,240-Math.sin((x+camX*.35)*.01)*34-Math.cos((x+camX*.35)*.024)*14);
 g.lineTo(W,H);g.fill();
}

function drawWorld(){
 drawSky();
 g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 g.translate(-camX,0);

 const c0=Math.max(0,Math.floor(camX/T)-1),c1=Math.min(COLS,c0+28);
 for(let y=0;y<ROWS;y++)for(let x=c0;x<c1;x++){
  const ch=grid[y][x],X=x*T,Y=y*T;
  if(ch==="D"){
   g.fillStyle="#7c5230";g.fillRect(X,Y,T,T);
   g.fillStyle="#4fb348";g.fillRect(X,Y,T,9);
   g.fillStyle="#69cf5e";g.fillRect(X,Y,T,3);
   if(hash(x*7.1)>.7){g.fillStyle="#4fb348";g.fillRect(X+10,Y-5,3,5);g.fillRect(X+16,Y-4,3,4)}
  }else if(ch==="#"){
   g.fillStyle="#5f5a6b";g.fillRect(X,Y,T,T);
   g.fillStyle="rgba(255,255,255,.14)";g.fillRect(X,Y,T,3);
   g.fillStyle="rgba(0,0,0,.24)";g.fillRect(X,Y+T-3,T,3);
  }
 }

 for(const sp of spikes){
  const X=sp.x*T,Y=sp.y*T;
  g.fillStyle="#c9d4e0";
  for(let k=0;k<2;k++){const sx=X+4+k*14;g.beginPath();g.moveTo(sx,Y+T);g.lineTo(sx+7,Y+12);g.lineTo(sx+14,Y+T);g.fill()}
 }

 if(shrine){
  const X=shrine.x*T,Y=shrine.y*T,pulse=.65+Math.sin(t*5)*.25;
  g.fillStyle="#6e687a";g.fillRect(X+4,Y-16,24,48);
  g.fillStyle="#ffd166";g.fillRect(X+8,Y-24,16,10);
  g.fillStyle="rgba(120,245,220,"+pulse+")";g.fillRect(X+10,Y-10,12,24);
 }

 for(const e of enemies){
  if(!e.alive)continue;
  g.fillStyle=e.hitT>0?"#fff":"#9e2a2b";g.fillRect(e.x,e.y+6,e.w,e.h-6);
  g.fillStyle=e.hitT>0?"#fff":"#c9ada7";g.fillRect(e.x+3,e.y,e.w-6,10);
  g.fillStyle="#ffd166";g.fillRect(e.x+(e.vx>0?14:4),e.y+12,4,4);
 }

 // Knight player
 const px=P.x,py=P.y,f=P.face,sw=P.onG&&Math.abs(P.vx)>5?Math.sin(t*18)*4:0;
 if(P.invuln<=0||Math.floor(t*20)%2===0){
  g.save();g.translate(px+P.w/2,py);g.scale(f,1);
  const ox=-P.w/2;
  // Cape
  g.fillStyle="#c92a2a";g.fillRect(ox-5,10,8,20+sw*.3);
  // Legs & boots
  g.fillStyle="#3b4252";g.fillRect(ox+4,26,6,14+sw*.4);g.fillRect(ox+12,26,6,14-sw*.4);
  g.fillStyle="#5c3a21";g.fillRect(ox+3,35,7,5);g.fillRect(ox+12,35,7,5);
  // Armor torso & helmet
  g.fillStyle="#8d99ae";g.fillRect(ox+3,12,16,15);
  g.fillStyle="#edf2f4";g.fillRect(ox+4,1,15,12);
  g.fillStyle="#2b2d42";g.fillRect(ox+11,5,7,3);
  g.fillStyle="#ffd166";g.fillRect(ox+5,-2,13,4);
  // Sword & slash arc
  const ang=atkT>0?-1.1+(1-atkT/CFG.atkT)*2.2:-.35;
  g.save();g.translate(ox+18,20);g.rotate(ang);
  g.fillStyle="#7f4f24";g.fillRect(-2,0,4,7);
  g.fillStyle="#e0fbfc";g.fillRect(-2,-22,4,22);
  g.restore();
  if(atkT>0){
   g.strokeStyle="rgba(184,242,255,.85)";g.lineWidth=4;
   g.beginPath();g.arc(ox+18,20,28,-.9,.9);g.stroke();
  }
  g.restore();
 }

 for(const p of SP)if(p.l>0){g.fillStyle=p.c;g.fillRect(p.x,p.y,p.s,p.s)}
 g.font="700 13px system-ui,sans-serif";g.textAlign="center";
 for(const ft of FT){g.fillStyle=ft.c;g.fillText(ft.txt,ft.x,ft.y)}

 g.restore();
}

function hud(){
 g.textAlign="left";g.font="700 16px system-ui,sans-serif";g.fillStyle="#fff";
 g.fillText("Stage "+(stage+1)+": "+STAGES[stage].n,14,24);
 g.fillStyle="#ff6b6b";g.fillText("HP: "+"♥".repeat(Math.max(0,hp))+"♡".repeat(Math.max(0,maxHp-hp)),14,46);
 g.textAlign="right";g.fillStyle="#ffd166";g.fillText("SCORE "+score+"   "+runT.toFixed(1)+"s",W-14,24);
 g.textAlign="center";g.font="500 13px system-ui,sans-serif";g.fillStyle="rgba(255,255,255,.85)";
 g.fillText(STAGES[stage].hint,W/2,H-10);
}

function card(title,lines,sub){
 g.fillStyle="rgba(7,6,14,.78)";g.fillRect(0,0,W,H);g.textAlign="center";
 g.fillStyle="#ffd166";g.font="800 42px system-ui,sans-serif";g.fillText(title,W/2,136);
 g.fillStyle="#fff";g.font="500 18px system-ui,sans-serif";lines.forEach((l,i)=>g.fillText(l,W/2,186+i*28));
 g.fillStyle="#cfd8e3";g.font="600 14px system-ui,sans-serif";g.fillText(sub,W/2,186+lines.length*28+28);
}

function draw(){
 drawWorld();
 if(state==="play")hud();
 else if(state==="title")card("KNIGHT SURFACE",["Surface action platformer: slash foes, dash gaps, reach the shrine.","A/D move · W/Space jump · J/Click slash · Shift/K dash · R reset · M mute"],"Press SPACE to start");
 else if(state==="clear")card("Stage Cleared!",["Next: "+STAGES[stage+1].n,"Score: "+score],"Press SPACE to continue");
 else if(state==="over")card(msg||"Defeated",["Score: "+score],"Press SPACE or R to retry stage");
 else if(state==="end")card("Surface Reclaimed!",["Total Time: "+runT.toFixed(1)+"s · Score: "+score,"Every shrine is lit."],"Press SPACE or R to play again");
}

let last=0;
function frame(ts){
 const dt=Math.min(.033,(ts-last)/1000||0);last=ts;t+=dt;
 if(state==="play")update(dt);
 if(shake>0)shake=Math.max(0,shake-dt*32);
 for(const p of SP)if(p.l>0){p.l-=dt;p.vy+=820*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
 for(let i=FT.length-1;i>=0;i--){FT[i].y-=26*dt;FT[i].l-=dt;if(FT[i].l<=0)FT.splice(i,1)}
 draw();requestAnimationFrame(frame);
}

function start(i){hp=maxHp;loadStage(i);state="play"}
function confirm(){
 audio();
 if(state==="title"){runT=0;score=0;start(0)}
 else if(state==="clear")start(stage+1);
 else if(state==="over")start(stage);
 else if(state==="end"){runT=0;score=0;start(0)}
 else if(state==="play")buf=CFG.buf;
}

addEventListener("keydown",e=>{
 if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();
 if(e.code==="KeyM"){muted=!muted;return}
 if(e.repeat)return;
 if(e.code==="ArrowLeft"||e.code==="KeyA")K.l=1;
 if(e.code==="ArrowRight"||e.code==="KeyD")K.r=1;
 if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){K.u=1;confirm()}
 if(e.code==="KeyJ")doSlash();
 if(e.code==="ShiftLeft"||e.code==="ShiftRight"||e.code==="KeyK")doDash();
 if(e.code==="KeyR"&&(state==="play"||state==="over"||state==="end")){if(state==="end"){runT=0;score=0;start(0)}else start(stage)}
});
addEventListener("keyup",e=>{
 if(e.code==="ArrowLeft"||e.code==="KeyA")K.l=0;
 if(e.code==="ArrowRight"||e.code==="KeyD")K.r=0;
 if((e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")&&state==="play"&&P.vy<0)P.vy*=.45;
});
cv.addEventListener("mousedown",e=>{
 audio();
 if(state==="play"){const r=cv.getBoundingClientRect();const mx=(e.clientX-r.left)*W/r.width+camX;P.face=mx>=P.x+P.w/2?1:-1;doSlash()}
 else confirm();
});
cv.addEventListener("contextmenu",e=>e.preventDefault());
loadStage(0);state="title";
requestAnimationFrame(frame);
</script>
</body>
</html>
