<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zephrys</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #191a2e; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById("c"), ctx = c.getContext("2d");
const p = { x: 60, y: 336, w: 20, h: 24, speed: 220 };
const keys = {};

addEventListener("resize", () => { c.width = innerWidth; c.height = innerHeight; });
addEventListener("keydown", e => { keys[e.code] = true; });
addEventListener("keyup", e => { keys[e.code] = false; });
c.width = innerWidth; c.height = innerHeight;

function loop() {
  const dir = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  p.x += dir * p.speed * (1 / 60);

  ctx.fillStyle = "#191a2e"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = "#38b000"; ctx.fillRect(0, 360, c.width, c.height - 360);
  ctx.fillStyle = "#e03131"; ctx.fillRect(p.x, p.y, p.w, p.h);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
