<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zephrys</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #191a2e; font-family: monospace; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .pad { position: fixed; bottom: 16px; display: none; gap: 10px; z-index: 10; }
  .pad-left { left: 16px; }
  .pad-right { right: 16px; }
  button.ctrl {
    width: 54px; height: 54px; border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.35);
    background: rgba(20, 22, 42, 0.72);
    color: #fff; font: bold 14px monospace;
    touch-action: none;
  }
  button.ctrl:active { background: rgba(255, 209, 102, 0.4); }
  @media (pointer: coarse), (max-width: 700px) {
    .pad { display: flex; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="pad pad-left">
  <button class="ctrl" id="btnLeft">&lt;</button>
  <button class="ctrl" id="btnRight">&gt;</button>
</div>
<div class="pad pad-right">
  <button class="ctrl" id="btnDash">DSH</button>
  <button class="ctrl" id="btnJump">JMP</button>
</div>
<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const TILE = 32;
const ROWS = 14;
const GRAVITY = 1750;
const STOMP_BOUNCE = 490;

let viewW = 800;
let viewH = 450;
let lives = 3;
let score = 0;
let coins = 0;
let won = false;
let gameOver = false;
let camX = 0;
let dashTimer = 0;
let dashCooldown = 0;
let hurtTimer = 0;
let coyoteTimer = 0;
let jumpBuffer = 0;
let walkTime = 0;
let muted = false;
let audioCtx = null;
const particles = [];

function sfx(freq, dur, type = "square", vol = 0.05) {
  if (muted) return;
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

function spawnBurst(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
    const spd = 70 + Math.random() * 140;
    particles.push({
      x,
      y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 50,
      life: 0.35 + Math.random() * 0.15,
      color
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 420 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function resizeCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, window.innerWidth);
  const h = Math.max(1, window.innerHeight);
  viewH = w < h ? 560 : 450;
  viewW = Math.max(360, Math.round(viewH * (w / h)));
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

const STAGES = [
  {
    name: "1. Moonlit Lake",
    sky: "#191a2e",
    pit: [14, 15],
    bricks: [[9, 18], [9, 19], [9, 20]],
    coins: [[7, 10], [19, 7]],
    spikes: [[22, 11]],
    enemyX: 10
  },
  {
    name: "2. Emerald Plains",
    sky: "#1e3a5f",
    pit: [11, 12, 20, 21],
    bricks: [[9, 10], [9, 11], [8, 19], [8, 20]],
    coins: [[10, 7], [20, 6], [24, 10]],
    spikes: [[16, 11]],
    enemyX: 14
  },
  {
    name: "3. Canyon Dusk",
    sky: "#3b2f63",
    pit: [9, 10, 17, 18, 19],
    bricks: [[9, 8], [9, 9], [8, 16], [8, 17], [8, 18]],
    coins: [[9, 7], [17, 6], [23, 10]],
    spikes: [[13, 11], [24, 11]],
    enemyX: 12
  }
];

const cols = 30;
let stageIdx = 0;
let grid = [];
let coinList = [];
let spikes = [];

const player = {
  x: 64,
  y: 8 * TILE,
  w: 22,
  h: 28,
  vx: 0,
  vy: 0,
  onGround: false,
  facing: 1
};

const enemy = {
  x: 10 * TILE,
  y: 12 * TILE - 26,
  w: 24,
  h: 26,
  vx: -60,
  alive: true
};

const keys = { left: false, right: false };

function triggerDash() {
  if (dashCooldown <= 0 && dashTimer <= 0 && !won && !gameOver) {
    dashTimer = 0.14;
    dashCooldown = 0.62;
    player.vy = 0;
    sfx(480, 0.08, "triangle", 0.05);
    spawnBurst(player.x + player.w / 2, player.y + player.h / 2, "#ffd166", 6);
  }
}

function isSolid(tx, ty) {
  if (tx < 0 || tx >= cols) return true;
  if (ty < 0 || ty >= ROWS) return false;
  const ch = grid[ty][tx];
  return ch === "G" || ch === "#" || ch === "=";
}

function resetPlayer() {
  player.x = 64;
  player.y = 8 * TILE;
  player.vx = 0;
  player.vy = 0;
  coyoteTimer = 0;
  jumpBuffer = 0;
  camX = 0;
}

function hurtPlayer() {
  if (hurtTimer > 0) return;
  lives -= 1;
  sfx(140, 0.22, "sawtooth", 0.06);
  spawnBurst(player.x + player.w / 2, player.y + player.h / 2, "#ff6b6b", 12);
  if (lives <= 0) {
    lives = 0;
    gameOver = true;
    return;
  }
  hurtTimer = 1.0;
  resetPlayer();
}

function loadStage(idx) {
  stageIdx = idx % STAGES.length;
  const s = STAGES[stageIdx];
  grid = Array.from({ length: ROWS }, (_, r) =>
    Array.from({ length: cols }, (__, c) => (r >= 12 ? "G" : "."))
  );
  for (const px of s.pit) { grid[12][px] = "."; grid[13][px] = "."; }
  for (const [by, bx] of s.bricks) grid[by][bx] = "#";
  grid[11][27] = "=";

  coinList = s.coins.map(([x, y]) => ({ x, y, taken: false }));
  spikes = s.spikes.map(([x, y]) => ({ x, y }));
  enemy.x = s.enemyX * TILE;
  enemy.vx = -60 - stageIdx * 12;
  enemy.alive = true;
  particles.length = 0;
  won = false;
  resetPlayer();
}
loadStage(0);

function updatePlayer(dt) {
  if (hurtTimer > 0) hurtTimer -= dt;
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir !== 0 && dashTimer <= 0) player.facing = dir;

  if (player.onGround) coyoteTimer = 0.11;
  else if (coyoteTimer > 0) coyoteTimer -= dt;
  if (jumpBuffer > 0) jumpBuffer -= dt;

  if (jumpBuffer > 0 && coyoteTimer > 0 && dashTimer <= 0) {
    player.vy = -695;
    player.onGround = false;
    coyoteTimer = 0;
    jumpBuffer = 0;
    sfx(350, 0.1, "square", 0.05);
  }

  if (dashCooldown > 0) dashCooldown -= dt;
  if (dashTimer > 0) {
    dashTimer -= dt;
    player.vx = player.facing * 510;
    player.vy = 0;
  } else {
    player.vx = dir * 225;
    player.vy = Math.min(920, player.vy + GRAVITY * dt);
  }

  player.x += player.vx * dt;
  const x0 = Math.floor(player.x / TILE);
  const x1 = Math.floor((player.x + player.w - 0.01) / TILE);
  const y0 = Math.floor(player.y / TILE);
  const y1 = Math.floor((player.y + player.h - 0.01) / TILE);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (isSolid(tx, ty)) {
        if (player.vx > 0) player.x = tx * TILE - player.w;
        else if (player.vx < 0) player.x = (tx + 1) * TILE;
      }
    }
  }

  const prevVy = player.vy;
  player.y += player.vy * dt;
  player.onGround = false;
  const fy0 = Math.floor(player.y / TILE);
  const fy1 = Math.floor((player.y + player.h - 0.01) / TILE);
  const fx0 = Math.floor(player.x / TILE);
  const fx1 = Math.floor((player.x + player.w - 0.01) / TILE);
  for (let ty = fy0; ty <= fy1; ty++) {
    for (let tx = fx0; tx <= fx1; tx++) {
      if (isSolid(tx, ty)) {
        if (player.vy > 0) {
          player.y = ty * TILE - player.h;
          player.onGround = true;
          player.vy = 0;
        } else if (player.vy < 0) {
          player.y = (ty + 1) * TILE;
          player.vy = 0;
        }
      }
    }
  }

  if (player.y > ROWS * TILE + 20) {
    hurtTimer = 0;
    hurtPlayer();
  }

  camX = Math.max(0, Math.min(cols * TILE - viewW, player.x - viewW * 0.35));
  return prevVy;
}

function updateEnemy(dt, prevVy) {
  if (!enemy.alive) return;
  enemy.x += enemy.vx * dt;

  const aheadX = Math.floor((enemy.x + (enemy.vx > 0 ? enemy.w : 0)) / TILE);
  const footY = Math.floor((enemy.y + enemy.h + 4) / TILE);
  if (isSolid(aheadX, 11) || !isSolid(aheadX, footY)) enemy.vx *= -1;

  if (
    player.x < enemy.x + enemy.w && player.x + player.w > enemy.x &&
    player.y < enemy.y + enemy.h && player.y + player.h > enemy.y
  ) {
    const stomping = prevVy > 0 && (player.y + player.h - prevVy * dt <= enemy.y + 12);
    if (stomping) {
      enemy.alive = false;
      player.y = enemy.y - player.h - 1;
      player.vy = -STOMP_BOUNCE;
      player.onGround = false;
      score += 200;
      sfx(460, 0.1, "square", 0.06);
      spawnBurst(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, "#ffd166", 12);
    } else {
      hurtPlayer();
    }
  }
}

function updateStageItems() {
  for (const c of coinList) {
    if (c.taken) continue;
    if (
      player.x < c.x * TILE + 24 && player.x + player.w > c.x * TILE + 8 &&
      player.y < c.y * TILE + 24 && player.y + player.h > c.y * TILE + 8
    ) {
      c.taken = true;
      coins++;
      score += 100;
      sfx(1180, 0.09, "square", 0.05);
      spawnBurst(c.x * TILE + 16, c.y * TILE + 16, "#ffd166", 7);
    }
  }

  for (const s of spikes) {
    if (
      player.x < s.x * TILE + 26 && player.x + player.w > s.x * TILE + 6 &&
      player.y < s.y * TILE + 32 && player.y + player.h > s.y * TILE + 12
    ) {
      hurtPlayer();
      return;
    }
  }

  const gx = Math.floor((player.x + player.w / 2) / TILE);
  const gy = Math.floor((player.y + player.h + 2) / TILE);
  if (grid[gy] && grid[gy][gx] === "=") {
    if (!won) {
      sfx(784, 0.22, "triangle", 0.07);
      spawnBurst(gx * TILE + 16, gy * TILE, "#38b000", 16);
    }
    won = true;
  }
}

function update(dt) {
  updateParticles(dt);
  if (won || gameOver) return;
  const prevVy = updatePlayer(dt);
  updateEnemy(dt, prevVy);
  updateStageItems();
}

function drawPlayer() {
  if (hurtTimer > 0 && Math.floor(hurtTimer * 16) % 2 === 0) return;
  const moving = Math.abs(player.vx) > 10 && player.onGround;
  if (moving) walkTime += 0.22;
  else walkTime = 0;
  const step = moving ? Math.sin(walkTime) * 3 : 0;

  ctx.save();
  ctx.translate(player.x + player.w / 2, player.y);
  ctx.scale(player.facing, 1);

  ctx.fillStyle = dashTimer > 0 ? "#ffd166" : "#e03131";
  ctx.fillRect(-2, 0, 10, 5);
  ctx.fillStyle = "#cbd5e1";
  ctx.fillRect(-8, 4, 16, 10);
  ctx.fillStyle = "#181824";
  ctx.fillRect(0, 7, 8, 3);
  ctx.fillStyle = "#2b8a3e";
  ctx.fillRect(-8, 14, 16, 8);
  ctx.fillStyle = "#221b28";
  ctx.fillRect(-7, 22 + step, 6, 6);
  ctx.fillRect(1, 22 - step, 6, 6);

  ctx.restore();
}

function drawEnemy() {
  if (!enemy.alive) return;
  const bob = Math.sin(performance.now() * 0.012) * 2;
  ctx.save();
  ctx.translate(enemy.x, enemy.y);

  ctx.fillStyle = "#f8fafc";
  ctx.fillRect(3, 0, 4, 4);
  ctx.fillRect(enemy.w - 7, 0, 4, 4);
  ctx.fillStyle = "#9e2a2b";
  ctx.fillRect(0, 3, enemy.w, enemy.h - 7);
  ctx.fillStyle = "#fff";
  ctx.fillRect(4, 8, 5, 5);
  ctx.fillRect(enemy.w - 9, 8, 5, 5);
  ctx.fillStyle = "#181824";
  ctx.fillRect(enemy.vx < 0 ? 4 : 6, 10, 2, 2);
  ctx.fillRect(enemy.vx < 0 ? enemy.w - 9 : enemy.w - 7, 10, 2, 2);
  ctx.fillStyle = "#450a0a";
  ctx.fillRect(3, enemy.h - 4 + bob, 6, 4);
  ctx.fillRect(enemy.w - 9, enemy.h - 4 - bob, 6, 4);

  ctx.restore();
}

function drawSkyBody() {
  if (stageIdx === 0) {
    ctx.fillStyle = "#fef08a";
    ctx.beginPath();
    ctx.arc(viewW - 120, 82, 24, 0, Math.PI * 2);
    ctx.fill();
  } else if (stageIdx === 1) {
    ctx.fillStyle = "#fde047";
    ctx.beginPath();
    ctx.arc(viewW - 130, 86, 28, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = "#fb923c";
    ctx.beginPath();
    ctx.arc(viewW - 140, 128, 34, 0, Math.PI * 2);
    ctx.fill();
  }
}

function render() {
  ctx.fillStyle = STAGES[stageIdx].sky;
  ctx.fillRect(0, 0, viewW, viewH);
  drawSkyBody();

  ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
  for (let hx = -200; hx < viewW + 200; hx += 220) {
    const px = hx - (camX * 0.25) % 220;
    ctx.beginPath();
    ctx.arc(px + 90, viewH - 70, 110, Math.PI, 0);
    ctx.fill();
  }

  ctx.save();
  ctx.translate(-camX, viewH - ROWS * TILE);
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < cols; x++) {
      const ch = grid[y][x];
      if (ch === "G") {
        ctx.fillStyle = "#8b542b";
        ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
        ctx.fillStyle = "#38b000";
        ctx.fillRect(x * TILE, y * TILE, TILE, 8);
      } else if (ch === "#") {
        ctx.fillStyle = "#b85d2b";
        ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
        ctx.strokeStyle = "#6e3212";
        ctx.strokeRect(x * TILE + 1, y * TILE + 1, TILE - 2, TILE - 2);
      } else if (ch === "=") {
        ctx.fillStyle = "#f59e0b";
        ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
        ctx.fillStyle = "#e2e8f0";
        ctx.fillRect(x * TILE + 14, y * TILE - 32, 4, 32);
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(x * TILE + 18, y * TILE - 30, 14, 10);
      }
    }
  }

  const coinBob = Math.sin(performance.now() * 0.008) * 3;
  for (const c of coinList) {
    if (c.taken) continue;
    ctx.fillStyle = "#ffd166";
    ctx.beginPath();
    ctx.arc(c.x * TILE + 16, c.y * TILE + 16 + coinBob, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff3b0";
    ctx.fillRect(c.x * TILE + 14, c.y * TILE + 11 + coinBob, 2, 6);
  }

  for (const s of spikes) {
    ctx.fillStyle = "#cbd5e1";
    ctx.beginPath();
    ctx.moveTo(s.x * TILE + 4, (s.y + 1) * TILE);
    ctx.lineTo(s.x * TILE + 16, s.y * TILE + 12);
    ctx.lineTo(s.x * TILE + 28, (s.y + 1) * TILE);
    ctx.fill();
  }

  drawEnemy();
  drawPlayer();

  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.restore();

  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px monospace";
  ctx.fillText(`${STAGES[stageIdx].name} | LIVES x${lives}  COINS x${coins}  SCORE ${score}  [M] SFX:${muted ? "OFF" : "ON"}`, 14, 24);
  if (won) {
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 22px monospace";
    ctx.fillText("STAGE CLEAR! Press N for next stage or R to replay", 14, 64);
  } else if (gameOver) {
    ctx.fillStyle = "#ff6b6b";
    ctx.font = "bold 24px monospace";
    ctx.fillText("GAME OVER! Press R to restart", 14, 64);
  }
}

function bindHold(id, onDown, onUp) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("pointerdown", e => { e.preventDefault(); onDown(); });
  el.addEventListener("pointerup", e => { e.preventDefault(); onUp(); });
  el.addEventListener("pointercancel", onUp);
  el.addEventListener("pointerleave", onUp);
}
bindHold("btnLeft", () => { keys.left = true; }, () => { keys.left = false; });
bindHold("btnRight", () => { keys.right = true; }, () => { keys.right = false; });
bindHold("btnJump", () => { jumpBuffer = 0.12; }, () => {});
bindHold("btnDash", () => { triggerDash(); }, () => {});

window.addEventListener("keydown", e => {
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
    jumpBuffer = 0.12;
  }
  if (e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyK") {
    triggerDash();
  }
  if (e.code === "KeyM") muted = !muted;
  if ((e.code === "KeyN" || e.code === "Enter") && won) {
    loadStage(stageIdx + 1);
  }
  if (e.code === "KeyR") {
    lives = 3;
    score = 0;
    coins = 0;
    gameOver = false;
    hurtTimer = 0;
    loadStage(0);
  }
});
window.addEventListener("keyup", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
});

let lastTs = 0;
function gameLoop(ts) {
  const dt = Math.min(0.033, (ts - lastTs) / 1000 || 0);
  lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
