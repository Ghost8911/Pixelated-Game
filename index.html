<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zephrys</title>
</head>
<body style="margin:0;overflow:hidden;background:#191a2e">
  <canvas id="c"></canvas>
  <script>
const c = document.getElementById("c"), ctx = c.getContext("2d");
const ac = new (window.AudioContext || window.webkitAudioContext)();
function sfx(f, d = 0.09, t = "square") {
  if (ac.state === "suspended") ac.resume();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = t; o.frequency.value = f; g.gain.setValueAtTime(0.08, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
}
const sparks = [];
function burst(x, y, col) {
  for (let i = 0; i < 8; i++) sparks.push({ x, y, vx: (Math.random() - 0.5) * 240, vy: (Math.random() - 0.8) * 240, col, t: 0.3 });
}
const ground = 360;
const plats = [
  { x: 220, y: 270, w: 120, h: 18 },
  { x: 380, y: 210, w: 110, h: 18, vx: 70, minX: 350, maxX: 520 },
  { x: 560, y: 280, w: 110, h: 18 }
];
const coins = [{ x: 280, y: 235, r: 8, taken: false }, { x: 460, y: 175, r: 8, taken: false }, { x: 615, y: 245, r: 8, taken: false }];
const pits = [{ x: 150, w: 60 }, { x: 350, w: 70 }];
let score = 0;
let lives = 3, dead = false;
const foe = { x: 420, y: ground - 22, w: 22, h: 22, vx: -90, minX: 360, maxX: 540, alive: true };
const goal = { x: 640, y: ground - 64, w: 6, h: 64 };
let won = false;
let camX = 0;
const p = { x: 60, y: ground - 24, w: 20, h: 24, vy: 0, grounded: true, jumps: 0, jumpHeld: false };
function hurt() {
  lives -= 1; sfx(160, 0.18, "sawtooth");
  if (lives <= 0) { lives = 0; dead = true; }
  p.x = 60; p.y = ground - p.h; p.vy = 0; p.jumps = 0; camX = 0;
}
const keys = {};
addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "KeyR" && (won || dead)) {
    p.x = 60; p.y = ground - p.h; p.vy = 0; p.jumps = 0;
    coins.forEach(cn => { cn.taken = false; }); foe.alive = true; foe.x = 420;
    score = 0; lives = 3; won = false; dead = false; camX = 0;
  }
});
addEventListener("keyup", e => { keys[e.code] = false; });
function resize() { c.width = innerWidth; c.height = innerHeight; }
addEventListener("resize", resize);
resize();

function draw() {
  if (!won && !dead) {
    const dir = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    p.x = Math.max(0, p.x + dir * 220 * (1 / 60));
    const wantJump = keys.Space || keys.ArrowUp || keys.KeyW;
    if (wantJump && !p.jumpHeld && p.jumps < 2) { p.vy = -620; p.grounded = false; p.jumps += 1; sfx(p.jumps === 1 ? 380 : 520); if (p.jumps === 2) burst(p.x + p.w / 2, p.y + p.h, "#74c0fc"); }
    p.jumpHeld = wantJump;
    const prevY = p.y;
    p.grounded = false;
    p.vy += 1600 * (1 / 60);
    p.y += p.vy * (1 / 60);
    const overPit = pits.some(pt => p.x + p.w > pt.x && p.x < pt.x + pt.w);
    if (!overPit && p.y >= ground - p.h) { p.y = ground - p.h; p.vy = 0; p.grounded = true; p.jumps = 0; }
    if (p.y > c.height + 40) hurt();
    for (const pl of plats) {
      if (p.vy >= 0 && prevY + p.h <= pl.y && p.y + p.h >= pl.y && p.x + p.w > pl.x && p.x < pl.x + pl.w) {
        p.y = pl.y - p.h; p.vy = 0; p.grounded = true; p.jumps = 0;
      }
    }
    for (const cn of coins) {
      if (!cn.taken && Math.hypot(p.x + p.w / 2 - cn.x, p.y + p.h / 2 - cn.y) < cn.r + 14) {
        cn.taken = true; score += 100; sfx(780, 0.07, "triangle"); burst(cn.x, cn.y, "#ffd166");
      }
    }
    if (foe.alive) {
      foe.x += foe.vx * (1 / 60);
      if (foe.x <= foe.minX || foe.x + foe.w >= foe.maxX) foe.vx *= -1;
      const hitX = p.x + p.w > foe.x && p.x < foe.x + foe.w;
      const hitY = p.y + p.h > foe.y && p.y < foe.y + foe.h;
      if (hitX && hitY) {
        if (p.vy > 0 && prevY + p.h <= foe.y + 8) {
          foe.alive = false; p.vy = -420; p.jumps = 1; score += 200; sfx(290, 0.1, "square"); burst(foe.x + foe.w / 2, foe.y + foe.h / 2, "#9c36b5");
        } else {
          hurt();
        }
      }
    }
    if (p.x + p.w > goal.x && p.x < goal.x + goal.w && p.y + p.h > goal.y) {
      won = true; score += 500; sfx(660, 0.2, "triangle");
    }
    camX = Math.max(0, p.x - c.width * 0.35);
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.x += s.vx * (1 / 60); s.y += s.vy * (1 / 60); s.vy += 600 * (1 / 60); s.t -= 1 / 60;
    if (s.t <= 0) sparks.splice(i, 1);
  }

  ctx.fillStyle = "#191a2e"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.save();
  ctx.translate(-camX, 0);

  ctx.fillStyle = "#38b000"; ctx.fillRect(0, ground, 1200, c.height - ground);
  ctx.fillStyle = "#191a2e";
  for (const pt of pits) ctx.fillRect(pt.x, ground, pt.w, c.height - ground);
  ctx.fillStyle = "#b85d2b";
  for (const pl of plats) ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
  ctx.fillStyle = "#ffd166";
  for (const cn of coins) if (!cn.taken) { ctx.beginPath(); ctx.arc(cn.x, cn.y, cn.r, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = "#e9ecef"; ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
  ctx.fillStyle = "#2ec4b6"; ctx.fillRect(goal.x + goal.w, goal.y, 24, 16);
  if (foe.alive) { ctx.fillStyle = "#9c36b5"; ctx.fillRect(foe.x, foe.y, foe.w, foe.h); }
  ctx.fillStyle = "#e03131"; ctx.fillRect(p.x, p.y, p.w, p.h);
  for (const s of sparks) { ctx.fillStyle = s.col; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }

  ctx.restore();
  ctx.fillStyle = "#fff"; ctx.font = "bold 15px monospace";
  ctx.fillText(`SCORE ${score}   LIVES ${lives}`, 16, 28);
  if (won) {
    ctx.fillStyle = "#ffd166"; ctx.font = "bold 24px monospace";
    ctx.fillText("STAGE CLEAR! PRESS R", 180, 170);
  }
  if (dead) {
    ctx.fillStyle = "#ff4d6d"; ctx.font = "bold 24px monospace";
    ctx.fillText("GAME OVER! PRESS R", 180, 170);
  }
  requestAnimationFrame(draw);
}
draw();
  </script>
</body>
</html>
